# Ruff only. Deliberately no [project] table: without a build backend
# `pip install -e .` starts failing and the repo becomes half a package for no
# reason. Deliberately no [tool.pytest.ini_options] either: pytest.ini wins, and
# a second pytest config is either dead or confusing.
[tool.ruff]
line-length = 100
# Must match the venv. With no [project].requires-python to infer from, ruff
# defaults to the newest Python it knows - 3.14 - and then formats FOR it. PEP
# 758 made `except A, B:` legal there, so `ruff format` silently stripped
# parentheses that 3.12 requires and produced a file python could not parse.
# `ruff check` passed on it, because check ran before format.
target-version = "py312"
# *.md: ruff >=0.16 formats Python blocks embedded in Markdown. The code samples
# in docs/ are prose, not compiled artifacts; leave them to the writer.
extend-exclude = ["venv", "venv.broken-py314", "mobile", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501 is unsatisfiable here: every overlong line lives inside a string literal
# (the extraction prompt, the privacy-page CSS, SQL) that no formatter can split.
# `ruff format` owns line length; a rule that can never pass just breeds noqa.
ignore = ["E501"]
