  - id: W3-13
    goal: "Verified running on the iOS Simulator against a local API with seeded location"
    verify: "MANUAL"
    touches: []
    depends_on: [W3-12]
    # blocked, not doing. /ml-tick takes the first `doing` task, and this one
    # can only be closed by a human looking at a screen - so `doing` meant the
    # loop picked a task it is forbidden to finish, forever, and never reached
    # W4-07 below it.
    state: blocked
    blocked_on: human
    gate: NEEDS_DECISION
    attempts: 1
    commit: null
    note: |
      PERFORMED 2026-09-21. Still `blocked`, and deliberately: verify is MANUAL,
      and test_done_task_is_actually_proven reserves `done` for machine-checked
      proof. A screenshot is not an exit code. That rule is right and is not
      being bent for the one task it was written about. W3-16 carries the part
      that is testable; this entry stays as the record.

      What was seen, on a real build - iPhone 16 Pro, iOS 18.3, Xcode 26.6,
      `npx expo run:ios`, NOT Expo Go: our own permission primer; the pinned
      credit strip with a byline; the same strip with a SourceLine; and the
      sealed composition refusing at 128m, inside the 150m radius.

      It earned its keep. expo-location was injecting three purpose strings the
      app has no business declaring - always-and-when-in-use, always, and motion
      - in its own boilerplate copy. Only the built Info.plist showed it. Fixed
      in app.json, asserted in tests/test_app_config.py.

      Borderline: iOS SIMULATOR builds need no signing identity and no Apple account, so
      the loop technically could run this. It was parked because it opens a GUI, takes
      several minutes, and needs a human to LOOK at the screen - the whole point is
      visual confirmation, which no exit code provides.
      Human runs:
        docker compose up -d --build api
        cd mobile && EXPO_PUBLIC_API_URL=http://localhost:8080 npx expo run:ios
        xcrun simctl location booted set <lat>,<lng>   # a coord with real data
      Confirm: permission prompt shows our copy, pins render, sheet opens, and the
      Watch button opens YouTube at the right second.
      Android CANNOT be verified locally - no SDK, no adb. It is covered by W3-09's
      manifest assertions and then by the first EAS build.
      ATTEMPT 1 (2026-09-20, commit aab8d65 unparked this): FAILED, not on our code.
      xcodebuild could not find a destination - iOS 26.5 was not installed, only the
      18.3 runtime, and Xcode 26 will not build against it.
      STATUS 2026-09-20, later: that blocker is GONE. `xcrun simctl list runtimes` now
      shows iOS 26.5 (23F77) installed, and an iPhone 16 Pro Max (iOS 18.3) is booted.
      PARTIALLY OBSERVED, NOT DONE. A parallel session reports running the app on that
      simulator, but `xcrun simctl listapps booted` shows only host.exp.Exponent
      (Expo Go) - com.PLACEHOLDER.memorylane is NOT installed. So the app ran in Expo
      Go, not as a native build, and that cannot close this task:
        - the permission prompt shown is Expo Go's own Info.plist string, NOT the copy
          in app.json that W3-07 asserts. The one thing this task most needs to confirm
          is the one thing Expo Go cannot show.
        - no native manifest is exercised: bundle identifier, blockedPermissions, the
          Android package, the Google Maps key. All still offline assertions only.
      What Expo Go DID plausibly verify: the map renders, pins appear, the sheet opens,
      the fetch against a local API works. Treat that as the JS layer passing.
      To actually close this: `cd mobile && rm -rf ios && EXPO_PUBLIC_API_URL=... npx
      expo run:ios`, which produces a real binary with our Info.plist.

  - id: W3-14
    goal: "Production iOS .ipa and Android .aab built by EAS"
