# ============================================================================
# THE CONTRACT. This file is the loop's closed world.
#
# APPEND-ONLY. The loop MAY edit:  state, attempts, commit, note, blocked_on
# The loop may NEVER edit:         id, goal, verify, touches, depends_on
# The loop may NEVER delete a task or weaken a `verify`.
#
# If a `verify` is genuinely wrong -> set state: blocked, gate: NEEDS_DECISION.
# You do not get to move your own goalposts.
#
# New ideas go in `inbox:` at the bottom. They are NOT executable.
# ============================================================================

meta:
  branch: loop/autopilot
  gate: ./loop/verify.sh
  states: [todo, doing, done, blocked]
  gates: [EAS_BUILD, STORE_ACCOUNT, API_CREDITS, DEPLOY, PUSH, SECRET, NEEDS_DECISION]

tasks:

  # -- W0 -- harness (built by hand in the bootstrap session) ----------------

  - id: W0-01
    goal: "Loop harness exists: verify.sh gates, contract test grades the loop, pytest runs offline"
    verify: "venv/bin/python -m pytest -q tests/test_loop_contract.py"
    touches: [loop/, tests/, requirements-dev.txt, .claude/commands/]
    state: done
    attempts: 1
    commit: b7fc77b
    note: "Written by hand during bootstrap. The loop did not author its own contract."

  # -- W1 -- crawler ---------------------------------------------------------

  - id: W1-01
    goal: "yt-dlp declared in requirements.txt under a '# Crawler' heading and importable"
    verify: "venv/bin/python -c 'import yt_dlp; print(yt_dlp.version.__version__)'"
    touches: [requirements.txt]
    state: done
    attempts: 1
    commit: 4a36a4b
    note: "Baseline measured 2026-09-20: the existing HTML regex returns 0 videos for
      every channel tested (@TheMountainDispatch 404s, @veritasium 302s, @mkbhd 0 ids).
      The scraper is not brittle, it is dead. yt-dlp has ZERO hard deps (verified on PyPI)."

  - id: W1-02
    goal: "crawler/yt_crawler.py is pure discovery: one list_channel_videos(url, limit)
      returning [{url, title, published_at}], plus an argparse __main__. fetch_transcript,
      save_transcript_txt, crawl_channel_transcripts and extract_video_id are DELETED."
    verify: "venv/bin/python -m pytest -q tests/test_crawler.py"
    touches: [crawler/, tests/test_crawler.py]
    depends_on: [W1-01]
    state: done
    attempts: 1
    commit: 099a12c
    note: "Deletion is most of this task. extract_video_id's last-path-segment fallback
      (old line 34) silently returned garbage - pipeline/ingest.py:extract_youtube_id
      validates 11 chars and becomes the repo's ONLY id parser. crawler must NOT import
      pipeline (one-way dependency, ingest imports crawler)."

  - id: W1-03
    goal: "Channel discovery returns well over 30 videos for a real channel (baseline today: 0)"
    verify: "venv/bin/python -m pytest -q -m live tests/test_crawler.py"
    touches: [crawler/, tests/test_crawler.py]
    depends_on: [W1-02]
    state: done
    attempts: 1
    commit: 2b2f5c5
    note: "MARKED live - NOT run by the gate. Run it explicitly for this task only.
      It needs network but costs no money."

  - id: W1-04
    goal: "A `channel:` key in config/content.yaml auto-discovers videos through the
      EXISTING ingest path, and published_at is populated on insert"
    verify: "venv/bin/python -m pytest -q tests/test_ingest.py"
    touches: [pipeline/ingest.py, tests/test_ingest.py]
    depends_on: [W1-02]
    state: done
    attempts: 1
    commit: d79700c
    note: "Reuse, do not rewrite: the dedup SELECT at ingest.py:73 and the INSERT at :85
      already exist. Add published_at to that INSERT (the column exists in schema.sql and
      is unused). pipeline/run_all.py needs NO change - discovery rides Stage 1.
      Use a local import inside the loop so yt_dlp stays off the path for yaml-only runs."

  - id: W1-05
    goal: "config/content.yaml declares a channel source with limit: 25"
    verify: "venv/bin/python -c \"import yaml;s=yaml.safe_load(open('config/content.yaml'))['sources'];assert any(x.get('channel') for x in s),'no channel source';print('ok')\""
    touches: [config/content.yaml]
    depends_on: [W1-04]
    state: done
    attempts: 1
    commit: d429e33
    note: "Bounded first run. Removing `limit` ingests the whole channel."

  - id: W1-06
    goal: "Transient transcript failures (network, IP block, age gate) leave the row
      PENDING for retry; only the three permanent exceptions set transcript_failed=TRUE"
    verify: "venv/bin/python -m pytest -q tests/test_transcripts.py"
    touches: [pipeline/transcripts.py, tests/test_transcripts.py]
    state: done
    attempts: 1
    commit: 522498e
    note: "ROOT CAUSE: the bare `except Exception` at transcripts.py:48-50 returns None,
      identical to 'no captions exist', so the caller at :107-112 permanently black-holes
      the video. One network blip = lost forever. Delete that handler, let transients
      propagate, catch them in fetch_pending_transcripts and `continue` WITHOUT setting
      the flag. The retry mechanism already exists (WHERE transcript_failed = FALSE).
      No new column, no counter, no backoff scheduler."

  - id: W1-07
    goal: "CLAUDE.md and docs/02-ingest.md document the channel: / limit: keys"
    verify: "grep -q 'channel' docs/02-ingest.md && grep -q 'channel' CLAUDE.md"
    touches: [CLAUDE.md, docs/02-ingest.md, docs/01-setup.md]
    depends_on: [W1-05]
    state: done
    attempts: 1
    commit: f426766
    note: null

  - id: W1-08
    goal: "End-to-end pipeline runs without spending credits"
    verify: "venv/bin/python -m pipeline.run_all --skip-extract"
    touches: []
    depends_on: [W1-05, W1-06]
    state: done
    attempts: 1
    commit: f426766
    note: "--skip-extract already exists at run_all.py:139 and is what keeps Stage 3
      (the only Anthropic caller) out of the loop entirely. Needs Docker db up."

  - id: W1-09
    goal: "Real extraction over the newly crawled channel; eyeball 20 memories for quality"
    verify: "MANUAL"
    touches: []
    depends_on: [W1-08]
    state: blocked
    blocked_on: human
    gate: API_CREDITS
    attempts: 0
    commit: null
    note: |
      The loop is forbidden from spending Anthropic credits. All extraction-path tests
      use tests/fakes.py::FakeAnthropic, which proves chunking/parsing/DB writes but
      CANNOT prove extraction quality. Only a human can judge that.
      Human runs:
        source venv/bin/activate && python -m pipeline.extract --limit 1
      then inspects:
        SELECT m.summary, p.name, m.extraction_confidence FROM memories m
        JOIN places p ON m.place_id=p.id ORDER BY m.id DESC LIMIT 20;
      Also worth doing here: the model IDs are a generation stale
      (claude-sonnet-4-20250514 -> claude-sonnet-5, claude-haiku-3-20240307 ->
      claude-haiku-4-5) and the per-chunk system prompt should get cache_control.

  # -- W2 -- backend deployable ---------------------------------------------

  - id: W2-01
    goal: ".dockerignore excludes venv/, .git/, .idea/, docs/, __pycache__, .env"
