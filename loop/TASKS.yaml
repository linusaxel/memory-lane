    touches: [Dockerfile]
    depends_on: [W2-01]
    state: done
    attempts: 1
    commit: 3edb43b
    note: "3.12 not 3.14 - wheel coverage for psycopg[binary]/pydantic.
      CMD MUST be shell form: exec form will not expand Railway's injected $PORT."

  - id: W2-03
    goal: "docker compose brings up an api service that serves / against the real PostGIS db"
    verify: "docker compose up -d --build api && sleep 5 && curl -fsS localhost:8080/ | grep -q '\"status\":\"ok\"'"
    touches: [docker-compose.yml]
    depends_on: [W2-02]
    state: done
    attempts: 1
    commit: 3edb43b
    note: "~8 lines added to the existing file, no new file. This is what proves the
      image boots against real PostGIS and that DATABASE_URL overrides the localhost
      default at pipeline/db.py:12."

  - id: W2-04
    goal: "CORS no longer sends allow_credentials with a wildcard origin"
    verify: "venv/bin/python -m pytest -q tests/test_api_cors.py"
    touches: [api/main.py, tests/test_api_cors.py]
    state: done
    attempts: 1
    commit: 81e71ef
    note: "api/main.py:21. allow_credentials=True with allow_origins=['*'] is an invalid
      combination browsers reject anyway, and a native app sends no cookies."

  - id: W2-05
    goal: "All route handlers are sync `def` so blocking SQLAlchemy runs in FastAPI's
      threadpool instead of stalling the event loop; engine uses pool_pre_ping"
    verify: "! grep -q '^async def' api/main.py && grep -q 'pool_pre_ping' pipeline/db.py"
    touches: [api/main.py, pipeline/db.py]
    state: done
    attempts: 1
    commit: 81e71ef
    note: "Root-cause fix is DELETING a keyword on 9 handlers. Smaller diff than async
      SQLAlchemy, no new deps. pool_pre_ping or the first request after idle 500s
      against managed Postgres."

  - id: W2-06
    goal: "GET /privacy returns a static HTML privacy policy"
    verify: "venv/bin/python -m pytest -q tests/test_api_privacy.py"
    touches: [api/main.py, tests/test_api_privacy.py]
    state: done
    attempts: 1
    commit: 81e71ef
    note: "~8 lines that DELETE A HUMAN BLOCKER: both stores require a reachable privacy
      policy URL and we already have an HTTPS host. Must disclose precise location use."

  - id: W2-07
    goal: "railway.json pins the Dockerfile builder and a healthcheck on /"
    verify: "venv/bin/python -c \"import json;d=json.load(open('railway.json'));assert d['deploy']['healthcheckPath']=='/';print('ok')\""
    touches: [railway.json]
    depends_on: [W2-02]
    state: done
    attempts: 1
    commit: 81e71ef
    note: "GET / already returns {'status':'ok'} so the healthcheck needs no new code.
      Railway chosen over Fly because Fly's managed Postgres has NO PostGIS extension -
      Railway runs the identical postgis/postgis:16-3.4 image already in compose."

  - id: W2-08
    goal: "API + PostGIS deployed to Railway on an HTTPS domain, schema applied, data loaded"
    verify: "MANUAL"
    touches: []
    depends_on: [W2-03, W2-07]
    state: blocked
    blocked_on: human
    gate: DEPLOY
    attempts: 0
    commit: null
    note: |
      The loop may not deploy or hold billing credentials.
      Human does, in order:
        1. Railway account + card. New project.
        2. Add service from image postgis/postgis:16-3.4, volume at
           /var/lib/postgresql/data, env PGDATA=/var/lib/postgresql/data/pgdata
        3. psql $DATABASE_URL -f db/schema.sql
        4. Add service from this repo (Railway auto-detects the Dockerfile).
           Set DATABASE_URL=${{Postgres.DATABASE_URL}}
        5. Load data: run the pipeline from your laptop against the prod DATABASE_URL,
           or pg_dump local -> restore.
        6. Note the HTTPS domain, then: ./api/test_api.sh https://<domain>
      The domain from step 6 unblocks W3-08.

  # -- W3 -- the app ---------------------------------------------------------

  - id: W3-01
    goal: ".nvmrc pins an LTS Node (22 or 24), because this machine runs non-LTS 25.9"
    verify: "test -f .nvmrc && grep -qE '^(v?22|v?24)' .nvmrc"
    touches: [.nvmrc]
    state: done
    attempts: 1
    commit: 8234334
    note: "Expo targets LTS. react-native-maps declares node >= 20.19.4 so 25 nominally
      passes, but toolchain friction here would burn loop ticks on pure noise."

  - id: W3-02
    goal: "Expo SDK 57 TypeScript app scaffolded at mobile/ with expo-location and
      react-native-maps installed via `expo install` (SDK-correct pins)"
    verify: "cd mobile && npx tsc --noEmit"
    touches: [mobile/, .gitignore]
    depends_on: [W3-01]
    state: done
    attempts: 1
    commit: 8234334
    note: "Use --template blank-typescript. The DEFAULT template is the expo-router tabs
      starter and would only have to be deleted. NO expo-router (one screen + one modal
      does not need a router), NO bottom-sheet lib (RN core Modal presentationStyle
      pageSheet is a native sheet), NO react-query/axios (one fetch in one useEffect).
      Add mobile/ios/, mobile/android/, mobile/node_modules/, mobile/.expo/ to .gitignore -
      prebuild output stays generated (CNG), never committed."

  - id: W3-03
    goal: "mobile/src/api.ts types a Memory and fetchNearby(); it drops memories whose
      place.coordinates is null before returning"
    verify: "cd mobile && npx tsc --noEmit"
    touches: [mobile/src/]
    depends_on: [W3-02]
    state: done
    attempts: 1
    commit: ceab849
    note: "places.coordinates is NULLABLE in the schema and a null-coordinate marker
      CRASHES react-native-maps. That filter is the trust boundary - keep it.
      Ignore meta entirely (meta.total is wrong on 3 endpoints); use memories.length.
      Base URL from process.env.EXPO_PUBLIC_API_URL (Expo inlines it at build time)."

  - id: W3-04
    goal: "mobile/src/region.ts converts a map viewport to a radius_km the API accepts,
      clamped to [0.1, 100]"
    verify: "cd mobile && node --test src/region.test.ts"
    touches: [mobile/src/]
    depends_on: [W3-02]
    state: done
    attempts: 1
    commit: ceab849
    note: "THE one piece of non-trivial logic in the app, so it gets the one runnable check.
      radiusKm = min(100, max(0.1, hypot(latDelta*111, lngDelta*111*cos(lat)) / 2))
      The clamp is MANDATORY: the API 422s above radius_km=100 and a continent-level
      zoom produces ~2000. Three asserts: city -> a few km, continent -> exactly 100,
      zero-delta -> >= 0.1. Node strips TS natively - no jest, no babel, no new dep.
      Import must use the explicit ./region.ts extension."

  - id: W3-05
    goal: "mobile/App.tsx renders a MapView with a Marker per memory, refetching on
      region change (debounced ~400ms), with a working location-denied fallback"
    verify: "cd mobile && npx tsc --noEmit"
    touches: [mobile/App.tsx, mobile/src/]
    depends_on: [W3-03, W3-04]
    state: done
    attempts: 1
    commit: ceab849
    note: "On DENIED permission fall back to a hardcoded region where the data actually
      is. A blank grey map is a store-review rejection and reviewers routinely tap Deny.
      Last-write-wins on the fetch is fine at one request per pan - no AbortController."

  - id: W3-06
    goal: "mobile/src/MemorySheet.tsx shows summary, place, distance, tags and confidence,
      and opens the YouTube deep link"
    verify: "cd mobile && npx tsc --noEmit"
    touches: [mobile/src/]
    depends_on: [W3-05]
    state: done
    attempts: 1
    commit: ceab849
    note: "content.timestamp_url already arrives from the API as a deep link to the right
      second - just Linking.openURL it, no timestamp math. onRequestClose is REQUIRED or
      the Android back button does nothing. There are NO images anywhere in the schema,
      so design around typography, not an image slot. Confidence is only ever high/medium."

  - id: W3-07
    goal: "mobile/app.json configures both platforms for store review"
    verify: "venv/bin/python -m pytest -q tests/test_app_config.py"
    touches: [mobile/app.json, tests/test_app_config.py]
    depends_on: [W3-02]
    state: done
    attempts: 1
    commit: ccbf902
    note: |
      Four entries are review decisions, not cosmetics:
        supportsTablet: false            -> removes the iPad screenshot requirement
        ITSAppUsesNonExemptEncryption:false -> removes the export-compliance questionnaire
                                            from EVERY TestFlight upload (true: HTTPS only)
        explicit permissions allowlist   -> and NEVER ACCESS_BACKGROUND_LOCATION, which
                                            triggers Play's background-location declaration
                                            form + screencast review, weeks of latency,
                                            for a feature v1 does not have
        location string via the expo-location PLUGIN, not hand-written infoPlist - the
        plugin generates NSLocationWhenInUseUsageDescription. Apple rejects vague strings,
        so name both the data and the benefit.
      Bundle id + Android package stay com.PLACEHOLDER.memorylane - a deliberate tripwire.

  - id: W3-08
    goal: "mobile/eas.json defines development/preview/production profiles with remote
      versioning, and production points at an HTTPS API URL"
    verify: "venv/bin/python -m pytest -q tests/test_app_config.py"
    touches: [mobile/eas.json, tests/test_app_config.py]
    depends_on: [W3-02]
    state: done
    attempts: 1
    commit: ccbf902
    note: "appVersionSource: remote + autoIncrement means EAS owns build numbers and you
      never hand-bump before a resubmit. preview with buildType apk gives a sideloadable
      Android build for screenshots without a store upload.
      EXPO_PUBLIC_API_URL MUST be https - iOS ATS blocks cleartext, so an http:// build
      passes locally and fails on device with an opaque network error.
      Stays PLACEHOLDER until W2-08 gives us the real domain."

  - id: W3-09
    goal: "Native config proven for BOTH platforms offline: iOS Info.plist has the location
      string, Android manifest has FINE_LOCATION and does NOT have BACKGROUND_LOCATION"
    verify: "cd mobile && npx expo prebuild --clean --platform all --no-install >/dev/null 2>&1 && grep -q NSLocationWhenInUseUsageDescription ios/*/Info.plist && grep -q ACCESS_FINE_LOCATION android/app/src/main/AndroidManifest.xml && ! grep -q ACCESS_BACKGROUND_LOCATION android/app/src/main/AndroidManifest.xml"
    touches: [mobile/]
    depends_on: [W3-07]
    state: done
    attempts: 1
    commit: ccbf902
    note: "THE trick that makes the missing Android SDK a non-issue before EAS: android
      prebuild only generates Gradle + manifest files, it needs NO Android SDK.
      Run `rm -rf mobile/ios mobile/android` afterwards to stay on CNG."

  - id: W3-10
    goal: "Placeholder icon (1024x1024, NO alpha channel), splash and adaptive icon exist"
    verify: "venv/bin/python -m pytest -q tests/test_app_assets.py"
    touches: [mobile/assets/, tests/test_app_assets.py]
    depends_on: [W3-02]
    state: done
    attempts: 1
    commit: b183d97
    note: "Apple REJECTS icons with an alpha channel - the test must assert the mode has
