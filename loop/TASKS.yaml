  - id: W3-12
    goal: "The app bundles for both platforms with no Metro resolution errors"
    verify: "cd mobile && npx expo export --platform all --output-dir /tmp/ml-export"
    touches: [mobile/]
    depends_on: [W3-06, W3-09]
    state: done
    attempts: 1
    commit: b183d97
    note: "SLOW (~2 min) and needs network, so it is deliberately NOT in verify.sh.
      Milestone gate - run once when every other W3 task is done. This is the last
      thing the loop can prove before the human gates."

  - id: W3-13
    goal: "Verified running on the iOS Simulator against a local API with seeded location"
    verify: "MANUAL"
    touches: []
    depends_on: [W3-12]
    state: blocked
    blocked_on: human
    gate: NEEDS_DECISION
    attempts: 0
    commit: null
    note: |
      Borderline: iOS SIMULATOR builds need no signing identity and no Apple account, so
      the loop technically could run this. It is parked because it opens a GUI, takes
      several minutes, and needs a human to LOOK at the screen - the whole point is
      visual confirmation, which no exit code provides.
      Human runs:
        docker compose up -d --build api
        cd mobile && EXPO_PUBLIC_API_URL=http://localhost:8080 npx expo run:ios
        xcrun simctl location booted set <lat>,<lng>   # a coord with real data
      Confirm: permission prompt shows our copy, pins render, sheet opens, and the
      Watch button opens YouTube at the right second.
      Android CANNOT be verified locally - no SDK, no adb. It is covered by W3-09's
      manifest assertions and then by the first EAS build.

  - id: W3-14
    goal: "Production iOS .ipa and Android .aab built by EAS"
    verify: "MANUAL"
    touches: []
    depends_on: [W3-12, W2-08]
    state: blocked
    blocked_on: human
    gate: EAS_BUILD
    attempts: 0
    commit: null
    note: |
      Costs money/quota and needs interactive 2FA. The loop must NEVER attempt it.
      Human does, in order:
        1. Replace com.PLACEHOLDER.memorylane in mobile/app.json with the real bundle id
           and Android package. IRREVERSIBLE once submitted - choose carefully.
        2. Put the real Railway HTTPS domain into mobile/eas.json production env.
        3. Google Cloud -> enable Maps SDK for Android -> API key -> app.json.
           Leave it UNRESTRICTED for now: restricting it to package+SHA-1 needs a signing
           SHA-1 that does not exist until step 5. Lock it down after.
        4. npm i -g eas-cli && npx eas-cli login && eas init   (writes extra.eas.projectId)
        5. eas credentials   (Apple cert + provisioning profile; Android keystore)
        6. eas build --profile production --platform all
      Ready-check before starting: ./loop/verify.sh green AND W3-12 done.

  - id: W3-15
    goal: "Listings submitted to App Store Connect and Google Play"
    verify: "MANUAL"
    touches: []
    depends_on: [W3-14]
    state: blocked
    blocked_on: human
    gate: STORE_ACCOUNT
    attempts: 0
    commit: null
    note: |
      Requires Apple Developer Program ($99/yr, identity verification, 1-7 days) and
      Google Play Console ($25 once). The loop cannot log in to either console.
      Prepared for you: mobile/store/listing.md, mobile/store/privacy.md, and the live
      privacy URL https://<railway-domain>/privacy from W2-06.

      App Store Connect: app record, upload build, privacy nutrition label
        (Location -> Precise -> App Functionality -> NOT linked to user), age rating
        questionnaire, content rights, privacy policy URL. Export compliance is
        pre-answered by ITSAppUsesNonExemptEncryption:false from W3-07.
      Play Console: upload .aab, Data safety form, IARC content rating, target audience,
        ads declaration, Play App Signing.
      Still needed by hand: Android screenshots (>=2 phone) + a 1024x500 feature graphic.
        Install the `preview` APK on a real Android device - there is no emulator here,
        and using iOS screenshots on a Play listing is a policy risk.

      *** THE ONE PEOPLE DISCOVER TOO LATE ***
      If this is a PERSONAL (non-organization) Play account, production access is gated
      behind CLOSED TESTING WITH 12 TESTERS FOR 14 CONTINUOUS DAYS, no matter how
      finished the app is. Start that the day step 6 of W3-14 produces an .aab.

