# ============================================================================
# THE CONTRACT. This file is the loop's closed world.
#
# APPEND-ONLY. The loop MAY edit:  state, attempts, commit, note, blocked_on
# The loop may NEVER edit:         id, goal, verify, touches, depends_on
# The loop may NEVER delete a task or weaken a `verify`.
#
# If a `verify` is genuinely wrong -> set state: blocked, gate: NEEDS_DECISION.
# You do not get to move your own goalposts.
#
# New ideas go in `inbox:` at the bottom. They are NOT executable.
# ============================================================================

meta:
  branch: loop/autopilot
  gate: ./loop/verify.sh
  states: [todo, doing, done, blocked]
  gates: [EAS_BUILD, STORE_ACCOUNT, API_CREDITS, DEPLOY, PUSH, SECRET, NEEDS_DECISION]

tasks:

  # -- W0 -- harness (built by hand in the bootstrap session) ----------------

