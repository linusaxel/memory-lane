    touches: []
    depends_on: [W1-08]
    state: blocked
    blocked_on: human
    gate: API_CREDITS
    attempts: 0
    commit: null
    note: |
      The loop is forbidden from spending Anthropic credits. All extraction-path tests
      use tests/fakes.py::FakeAnthropic, which proves chunking/parsing/DB writes but
      CANNOT prove extraction quality. Only a human can judge that.
      Human runs (there is NO --limit flag; extract bills every pending video,
      so go through the queue path for one):
        source venv/bin/activate
        python -m pipeline.enqueue --video <content_id> && python -m pipeline.worker
      then inspects:
        SELECT m.summary, p.name, m.extraction_confidence FROM memories m
        JOIN places p ON m.place_id=p.id ORDER BY m.id DESC LIMIT 20;
      The model IDs and the prompt's cache_control were both fixed since this
      was written; pipeline/config.py has the current defaults.

