        3. psql $DATABASE_URL -f db/schema.sql
        4. Add service from this repo (Railway auto-detects the Dockerfile).
           Set DATABASE_URL=${{Postgres.DATABASE_URL}}
        5. Load data: run the pipeline from your laptop against the prod DATABASE_URL,
