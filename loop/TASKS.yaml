    touches: [mobile/src/]
    depends_on: [W3-02]
    state: done
    attempts: 1
    commit: ceab849
    note: "THE one piece of non-trivial logic in the app, so it gets the one runnable check.
      radiusKm = min(100, max(0.1, hypot(latDelta*111, lngDelta*111*cos(lat)) / 2))
      The clamp is MANDATORY: the API 422s above radius_km=100 and a continent-level
      zoom produces ~2000. Three asserts: city -> a few km, continent -> exactly 100,
      zero-delta -> >= 0.1. Node strips TS natively - no jest, no babel, no new dep.
      Import must use the explicit ./region.ts extension."

  - id: W3-05
