    commit: ed86332
    note: |
      The testable half of W3-13, which cannot be `done` because its verify is
      MANUAL.

      THE DEFECT. app.json set only locationWhenInUsePermission, and
      expo-location's plugin fills NSLocationAlwaysAndWhenInUseUsageDescription,
      NSLocationAlwaysUsageDescription and NSMotionUsageDescription with its own
      boilerplate unless each is explicitly `false` (applyPermissions in
      @expo/config-plugins deletes the key on false). So the built app declared
      always-on location and motion, in copy reading "Allow MemoryLane to access
      your location", for features it does not have. A purpose string is what
      App Store review reads as intent, so this contradicted UI.md rule 2 - and
      the Android side being handled is exactly what made the pair look done.
      The test asserts app.json, not the plist, because ios/ is a gitignored
      prebuild artifact; verified against the generated plist by hand.

      THE AFFORDANCE. There is no tap automation for this simulator - idb is not
      installed, osascript has no assistive access - so every change to the
      sheet had been verified by tsc and nothing else. EXPO_PUBLIC_DEV_OPEN_MEMORY
      opens one memory on launch, under __DEV__ only, modelled on devLocation.ts.
      Fires once through a useRef so closing the sheet by hand does not spring it
      open again. Fifteen lines, and every future sheet state is screenshottable.

      THE SEED. A seventh dev-seed memory, sealed five years out and planted at
      ~128m - INSIDE the unlock radius on purpose, because a time capsule 400m
      away demonstrates nothing the padlock at `walk` does not already. Its
      offset was checked against P3-06's grid-cell trap and the existing
      test_no_two_gated_seeds_share_a_grid_cell covers it; the new test asserts
      it through row_to_memory rather than off the column, because the ordering
      of the two gates inside is_locked is the thing that matters.

  - id: W3-17
    goal: "A sealed memory must not look openable: not the pin, not the
      within-reach count, not the walk hint."
    verify: "cd mobile && npm run typecheck && npx tsx --test src/reach.test.ts"
    touches: [mobile/src/reach.ts, mobile/src/reach.test.ts, mobile/src/devOpen.ts,
      mobile/App.tsx, mobile/.env.example, mobile/UI.md, docs/08-ux-flows.md]
    depends_on: [W3-16]
    state: done
    attempts: 1
    commit: PENDING
    note: |
      Found by looking at the map, which is the second defect the native build
      has turned up and the reason W3-13 was worth doing.

      reachOf filtered on memory.locked and then measured distance, so the
      sealed dev seed at 128m came back `unlockable`. Three lies from one
      predicate: the pin wore the seal ring ("come and open this"), the banner
      counted it in "4 memories within reach", and nearestLocked - which returns
      null the moment anything is unlockable - could suppress the walk hint for
      a pin somebody genuinely could reach.

      One fix in the one place all three route through: isSealed in reach.ts,
      and distance now only has an opinion about memories distance can open. A
      group of nothing but seals stays `locked`, which is honest - shut - rather
      than amber for a walk that achieves nothing. Mutation-checked: restore the
      old filter and exactly the three new tests fail.

      Also here because it is what made the looking possible:
      EXPO_PUBLIC_DEV_OPEN_SCREEN (map|collection|you|submit). The submit sheet
      is three taps in, so the seal control shipped in P5-02 had never been
      rendered at all; it turned out fine, but that was luck.

      TRAP for the next tick, now in UI.md: `xcrun simctl terminate` can fail
      silently, and `launch` then merely foregrounds the running app. Fast
      Refresh applies the new bundle while component state survives, so the
      previous screenshot's screen is still open and the knob looks broken.
      /tmp/screen.sh retries the terminate and polls launchctl.

