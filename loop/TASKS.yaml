      and the credit was inside it, so any story long enough to scroll pushed
      the attribution out of frame - and a screenshot is the only way geo-gated
      content travels, so that lost the distribution channel and the legal
      posture in one. The credit is now a pinned strip between the scroll and
      the actions; it carries the one hairline, so SourceLine, the byline and
      the bare title each gave up their own; and it is skipped entirely when
      there is nothing to credit. Rule 11 in mobile/UI.md.

      NOT eyeballed on a simulator - W3-13 is still parked on a human. tsc is
      the only check this has, which is what UI work in this repo gets.

      Do not run `npx prettier` on mobile/: there is no config, so it rewrites
      every file to double quotes and 80 columns. Match the file by hand.

