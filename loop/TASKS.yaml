    touches: [.dockerignore]
    state: done
    attempts: 1
    commit: 3edb43b
    note: "Without this the ~300MB venv/ goes into the build context."

  - id: W2-02
    goal: "Dockerfile builds the API on python:3.12-slim with a shell-form CMD honouring $PORT"
