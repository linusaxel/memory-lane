# Content configuration for Memory Lane
# Add YouTube videos that contain location-rich stories

sources:
  - name: "Tuesdays with Stories"
    platform: youtube
    # Auto-discover the newest episodes. The hand-listed videos below are kept:
    # ingest merges both lists and dedups on the normalized URL, so an episode
    # appearing in both is inserted once. Drop `limit` to ingest the whole channel.
    channel: "https://www.youtube.com/@TuesdayswithStories"
    limit: 25
    videos:
      - url: "https://www.youtube.com/watch?v=_SPUkqdle_Q"
      - url: "https://www.youtube.com/watch?v=41q_CYtRPuM"
      - url: "https://www.youtube.com/watch?v=eG74ck-Jy8s"
      - url: "https://www.youtube.com/watch?v=5dRXEpQimGU"
      - url: "https://www.youtube.com/watch?v=15ntXeFf5Wg"
      - url: "https://www.youtube.com/watch?v=7CTC7rj5jV4"
      - url: "https://www.youtube.com/watch?v=WFr8vnw2diI"
      - url: "https://www.youtube.com/watch?v=kZAqbulueXc"
      - url: "https://www.youtube.com/watch?v=QGCLljlLf1g"
      - url: "https://www.youtube.com/watch?v=0IHZRUW72Xs"

  - name: "Københavnerliv"
