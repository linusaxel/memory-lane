# F7's free way in: three memories a day open from anywhere, with no walk and
# without standing there. docs/08-ux-flows.md F7, docs/10-decisions.md "Three
# free a day, then steps where you stand".
#
# The step count is at the top of the map, and a free one spent shows there.

appId: ${APP_ID}
---
- runFlow:
    file: steps/launch.yml
    env:
      LAT: ${START_LAT}
      LNG: ${START_LNG}
      LOCATION: inuse

- extendedWaitUntil:
    visible: "3 free today, 0 steps\\."
    timeout: 20000
- tapOn: "Ringkaféen, dev seed\\. Locked, too far to open\\."
- extendedWaitUntil:
    visible: "Open it now, 3 free today"
    timeout: 10000
- tapOn: "Open it now, 3 free today"
- extendedWaitUntil:
    visible: ".*Lygteå.*"
    timeout: 30000
- tapOn: "Close"
- extendedWaitUntil:
    visible: "2 free today, 0 steps\\."
    timeout: 10000
