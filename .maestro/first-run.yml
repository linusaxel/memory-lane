# A first run: F1 the planner from the map (loop, one way, its list, ×) + F32 another
# walk + F8 be asked for location, then F8 refused and F1 nothing walkable.
# docs/08-ux-flows.md
#
# No walk is accepted, so no route row is written and the three launches can
# share one database.

appId: ${APP_ID}
---
# ---- F8 + F1
#
# The first screen is ours, not a system dialog: the map, and from its Plan a
# walk the planner, drawing a walk from central Copenhagen, and its Use my location is the ask, a press with a
# reason (F8).
- runFlow:
    file: steps/launch.yml
    env:
      LAT: ${START_LAT}
      LNG: ${START_LNG}
      LOCATION: unset
- extendedWaitUntil:
    visible:
      id: "planning-from-centre"
    timeout: 40000
- tapOn: "Use my location"
- tapOn:
    text: "Allow While Using App"
    optional: true

# F1: drawn again from here. The whole loop on the map, then its list, and a decision.
- extendedWaitUntil:
    visible: "4 memories · .* loop"
    timeout: 40000
- assertNotVisible:
    id: "planning-from-centre"
# The stops land as the line draws through them.
- extendedWaitUntil:
    visible: "Stop 4 of 4\\. .*"
    timeout: 5000
# Step two, the stops, is a subscriber's: a free walker starts from step one,
# and the padlocked See the stops is the paywall.
- assertVisible: "Start this walk"
- tapOn: "See the stops"
- extendedWaitUntil:
    visible: "More than one walk a day"
    timeout: 20000
- tapOn: "Not now"
- assertNotVisible:
    id: "walk-stops"

# F32: › is another walk as good, or one of a similar length, still a preview.
- assertNotVisible: "Previous walk"
- tapOn: "Next walk"
- extendedWaitUntil:
    visible: "Previous walk"
    timeout: 40000
- assertVisible: "[0-9]+ memories · .* loop"
- assertVisible: "See the stops"
# Pages: back to the first, which has no ‹.
- tapOn: "Previous walk"
- extendedWaitUntil:
    notVisible: "Previous walk"
    timeout: 5000
- assertVisible: "4 memories · .* loop"

# One way redraws in place: the same four stops' worth, ending somewhere new.
- tapOn: "One way"
- extendedWaitUntil:
    visible: "[0-9]+ memories · [0-9.]+ k?m"
    timeout: 40000
- assertNotVisible: "[0-9]+ memories · .* loop"
- tapOn: "Loop"
# × goes back to the map from any step, and Plan a walk plans again.
- tapOn: "Close the planner"
- assertNotVisible: "A walk from here"
- tapOn: "Plan a walk"
- extendedWaitUntil:
    visible: "4 memories · .* loop"
    timeout: 40000

# ---- F8, refused
#
# A reviewer who taps Deny still gets a walk, planned from central Copenhagen and saying so.
- runFlow:
    file: steps/launch.yml
    env:
      LAT: ${START_LAT}
      LNG: ${START_LNG}
      LOCATION: never
- extendedWaitUntil:
    visible:
      id: "planning-from-centre"
    timeout: 40000

# ---- F1, nothing walkable
#
# From Malmö there is nothing within any length of walk. The planner says so
# and offers the slider back, rather than accepting an empty day. Not
# Copenhagen: `seed_dev --routes lakes` plants the lakes there.
- runFlow:
    file: steps/launch.yml
    env:
      LAT: 55.605
      LNG: 13.0038
      LOCATION: inuse
- extendedWaitUntil:
    visible:
      id: "no-walk"
    timeout: 40000
- assertVisible: "Walk length"
