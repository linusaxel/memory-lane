# F5 File a memory of your own (+ F21 Be somebody), then F24 Manage what you
# filed, and F26/F33 the author hears back. docs/08-ux-flows.md
#
# The only screen in the app that writes. It files where you are standing and
# nowhere else - there is no map picker, deliberately - and what comes back is
# already unlocked, because you were the one standing there.
#
# Then it finds it again the way the author does: the journal's Filed
# section, not the map. Confirms it shows what was filed, that opening a row
# hands back the same text, and that a change made there survives closing the
# editor and coming back.

appId: ${APP_ID}
---
- runFlow:
    file: steps/launch.yml
    env:
      LAT: ${START_LAT}
      LNG: ${START_LNG}
      LOCATION: inuse

# Add is on the map and on a walk, not in the planner: filing needs no walk.
- tapOn: "Close the planner"
# One coordinate, taken from where the phone is. No field asks for it. The
# text is something this flow can look for again once it sits in a list.
- tapOn: "Add a memory here"
- assertVisible: "Next"
- takeScreenshot: add-memory

# The fields have no box and no label on screen, so the flow finds them by id.
- tapOn:
    id: "title"
- inputText: "The step by the ferry landing"

# The tags are the #words in it (pipeline/tags.py, from_text): no picker.
# The marks are typed as markdown and set as they will read (story.ts).
- tapOn:
    id: "story"
- inputText: "A ferry horn woke the whole dock. It was **loud** and *long*, and nobody could stop laughing about it after. #food"

# The story is blocks (docs/10, "A story has a little markdown"). A blank
# line starts the next; Heading, under Aa in the bar over the keyboard, turns
# it into one.
- pressKey: Enter
- pressKey: Enter
- tapOn:
    id: "toolbar-style"
- tapOn:
    id: "toolbar-heading"
- inputText: "The horn"

# Divider drops a flourish and a paragraph under it; Quote turns that.
- tapOn:
    id: "toolbar-divider"
- tapOn:
    id: "toolbar-quote"
- inputText: "Somebody do it again"
# Reordered: a tapped divider shows ↑ ↓; it moves up past the heading.
- tapOn:
    id: "divider"
- tapOn:
    id: "block-up"
# Back in the quote, so the photo goes in under it. The keyboard goes down
# first; the quote now sits at the page's edge, half under the bar.
- tapOn: "Done styling"
- tapOn: "Hide keyboard"
- runFlow:
    file: steps/tap-clear.yml
    env:
      ID: block-quote
- takeScreenshot: editor-blocks

# A photo, which no other flow attaches: SDK 57's expo/fetch once refused the
# { uri } FormData part and every upload failed without reaching the API.
# iOS 26 asks for full access despite run.sh's simctl grant; left unanswered,
# that prompt outlives the app and fails the next launch on "Memory Lane".
# It goes in under the quote, picked, the editor scrolled to it.
- tapOn: "Choose photo"
- tapOn:
    text: "Allow Full Access"
    optional: true
# The picker slides up slowly, and runs out of process, so Maestro can't
# wait on its text; tapping before it lands hits the sheet.
- waitForAnimationToEnd:
    timeout: 5000
# The first stock photo, top left of the grid.
- tapOn:
    point: "17%,30%"
# Next stays disabled until the upload is back; the id only says photo then.
- extendedWaitUntil:
    visible:
      id: "photo"
    timeout: 30000

# A third of the column, on the left: the paragraph after it wraps it.
# Scrolled to first: under the page's edge is the bar, and its Photo.
- scrollUntilVisible:
    element:
      id: "block-p"
    direction: DOWN
- tapOn:
    id: "photo-size-s"
- tapOn:
    id: "photo-left"
- tapOn:
    id: "block-p"
- inputText: "We stayed on the step until the first ferry came in, and the man who blew the horn waved at us from the bridge as if we had been waiting for him all along, which by then we had. "
# B with nothing selected leaves a pair to type into.
- tapOn:
    id: "toolbar-style"
- tapOn:
    id: "toolbar-bold"
- inputText: "proud"
- tapOn:
    id: "caption"
- inputText: "The dock at dawn"
- takeScreenshot: editor-photo

# Next opens the seal: the locket is chosen once the story is written.
- tapOn: "Next"
- assertVisible:
    id: "locket-hunter-compass"
- takeScreenshot: seal
- tapOn:
    id: "seal"

# One sentence and its #words are one paragraph (hashtags.ts, lede).
- extendedWaitUntil:
    visible: ".*ferry horn.*"
    timeout: 40000
- assertVisible: ".*after. #food"
- assertVisible: "The step by the ferry landing"
- takeScreenshot: filed-memory
# Every block the editor made, set as the sheet reads it: the marks gone.
- assertVisible: "The horn"
- assertVisible: "Somebody do it again"
- assertNotVisible: ".*\\*\\*.*"
# F21: signed Anonymous until you give a name.
- assertVisible: ".*Anonymous.*"
# The card's photo is the API's copy, not the phone's file, captioned and
# wrapped by the paragraph after it.
- scrollUntilVisible:
    element: "The dock at dawn"
    direction: DOWN
- assertVisible:
    id: "photo"
- assertVisible: ".*proud.*"

# F33 from the author's own phone, which is the only one a flow has: the
# author unlocked it by filing it, so they may sign it. They may not heart it
# (api/write.py), and are not offered Report or Block: their ⋯ holds Edit
# alone. What matters is what comes back in the journal.
- assertNotVisible: "Heart"
- tapOn: "More"
- assertVisible: "Edit this memory"
- takeScreenshot: author-menu
- assertNotVisible: "Report this memory"
- tapOn: "Cancel"
- scrollUntilVisible:
    element:
      id: "note"
    direction: DOWN
- tapOn:
    id: "note"
- inputText: "Still laughing."
- pressKey: Enter
# Rewrite is only offered on a note the server has, not on a draft.
- extendedWaitUntil:
    visible: "Rewrite"
    timeout: 30000
- hideKeyboard
- tapOn: "Close"

# Back on the planner, it is not a pin: only the walk's stops are drawn, and
# what you filed is open. It comes back in the journal below.
- assertNotVisible: "The step by the ferry landing.*\\. (Unlocked, in your collection|Open)\\."

# The tab says something came back before it is opened, and the row says what.
- tapOn: "Journal"
- extendedWaitUntil:
    visible: "Mine ·"
    timeout: 40000
- tapOn: "Mine ·"

# A server fetch: wait for its own note rather than the place name.
- extendedWaitUntil:
    visible: ".*of yours.*"
    timeout: 40000
- assertVisible: "The step by the ferry landing, .*1 note, New"
# Opening the tab was the look: the dot goes with it.
- assertVisible: "Mine"
- takeScreenshot: journal-mine

# The Filed row opens the same sheet as editing: fields come back exactly as
# filed. Rows carry a live distance alongside the place name in their
# accessibility label (Memories.tsx's Row), so the tap needs the wildcard -
# after the comma, or it lands on the map's own pin for it behind the journal.
- tapOn: "The step by the ferry landing, .*"
- assertVisible: "Save"
- assertVisible: ".*The step by the ferry landing"
- assertVisible: ".*ferry horn.*"
- takeScreenshot: edit-memory

# Change the place name and save. Next becomes Save while editing - same
# button, relabelled. Both fields asserted above sit above the fold, so
# nothing here has scrolled yet.
#
# eraseText deletes backward from wherever the tap put the cursor, so the
# name is cleared twice (below) and typed whole.
# The photo comes back where it was put; L makes it full width again. First,
# while no keyboard covers the photo's controls.
- tapOn:
    id: "photo"
- tapOn:
    id: "photo-size-l"
# The camera is a viewfinder in the story, under the tapped photo; the shot
# takes its place. The simulator has no camera: expo-camera hands back a
# generated picture, which uploads like any other.
- tapOn:
    id: "toolbar-camera"
# iOS 26 asks for the camera too, simctl grant or not.
- tapOn:
    text: "Allow"
    optional: true
- scrollUntilVisible:
    element:
      id: "camera-take"
    direction: DOWN
- takeScreenshot: camera
- tapOn:
    id: "camera-take"
- extendedWaitUntil:
    notVisible:
      id: "photo-uploading"
    timeout: 30000
- assertNotVisible:
    id: "camera-take"
- scrollUntilVisible:
    element:
      id: "title"
    direction: UP
# And a little further: Maestro calls the title visible while the header
# still covers its middle. Short, so at the top it cannot dismiss the sheet.
- swipe:
    start: "50%, 40%"
    end: "50%, 52%"
- tapOn:
    id: "title"
- eraseText: 60
# A two-line title puts the tap's caret mid-text, so what was after it is
# left; on one short line the tap lands past its end.
- tapOn:
    id: "title"
- eraseText: 60
- inputText: "The jetty by the ferry landing"
- tapOn: "Save"
- tapOn:
    id: "seal"

# Back on the journal - onSaved closes the editor the same way onPosted does,
# and App.tsx's mineVersion bump means Filed has already refetched without the
# journal being closed and reopened.
- extendedWaitUntil:
    visible: ".*The jetty by the ferry landing.*"
    timeout: 40000
- assertNotVisible: "The step by the ferry landing"

- tapOn: "The jetty by the ferry landing, .*"
- assertVisible: "Save"
- assertVisible: ".*The jetty by the ferry landing"
- assertVisible: ".*ferry horn.*"

# Delete this memory sits below the fold - scrollUntilVisible rather than
# assertVisible's own search, which swipes from the top and can read as the
# pageSheet's own pull-to-dismiss gesture. Cancel lives in the fixed bar, not
# the ScrollView, so it stays reachable at whatever scroll position this ends on.
- scrollUntilVisible:
    element: "Delete this memory"
    direction: DOWN
- tapOn: "Cancel"
- assertVisible: "Mine"
