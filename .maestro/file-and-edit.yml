# F5 File a memory of your own (+ F21 Be somebody), then F24 Manage what you
# filed. docs/08-ux-flows.md
#
# The only screen in the app that writes. It files where you are standing and
# nowhere else - there is no map picker, deliberately - and what comes back is
# already unlocked, because you were the one standing there.
#
# Then it finds it again the way the author does: the
# Memories tab's "My memories" subtab, not the map. Confirms the subtab
# shows what was filed, that opening a row hands back the same text, and that
# a change made there survives closing the editor and coming back.
#
# Filing something unlocks it too, so the same place name lands on both of
# Memories' subtabs - checked below right after filing, on Unlocked (the
# default subtab) before switching to My memories.

appId: ${APP_ID}
---
- setLocation:
    latitude: 40.7484
    longitude: -73.9857

- launchApp:
    clearState: true
    permissions:
      location: inuse

# "+ Add" arrives with the walk, so plan and accept one first.
- extendedWaitUntil:
    visible: "How far today?"
    timeout: 40000
- tapOn: "Show me the walk"
- extendedWaitUntil:
    visible: "5 stops · .* loop"
    timeout: 40000
- tapOn: "Accept this walk"

# One coordinate, taken from where the phone is. No field asks for it. The
# text is something this flow can look for again once it sits in a list.
- tapOn: "Add a memory here"
- assertVisible: "Add a memory"

- tapOn: "The bench by the harbour"
- inputText: "The step by the ferry landing"

- tapOn: "We sat here until it got light and nobody wanted to say so."
- inputText: "A ferry horn woke the whole dock and nobody could stop laughing about it after."
- tapOn: "Add a memory"

# A closed vocabulary, mirrored from pipeline/tags.py.
- tapOn: "food"
- tapOn: "Post"

- extendedWaitUntil:
    visible: ".*ferry horn.*"
    timeout: 40000
- assertVisible: "The step by the ferry landing"
# F21: signed Anonymous until you give a name.
- assertVisible: ".*Anonymous.*"
- tapOn: "Close"

- tapOn: "Memories.*"
- assertVisible: "Unlocked"
- assertVisible: "My memories"

# Filing unlocked it too, so it sits on Unlocked - the default subtab - as
# soon as that unlock is written back to the local cache. `rememberUnlocked`
# is awaited, not synchronous, so this still needs a wait, not a bare assert.
# Unlocked's row carries "<name>, <when>" as its full accessibility text
# (Row's `meta`), and text matching here is a full-string regex, so the name
# alone needs the wildcard - unlike the bare match used for the My memories
# row further down, which has no `meta` to trail it.
- extendedWaitUntil:
    visible: ".*The step by the ferry landing.*"
    timeout: 40000

- tapOn: "My memories"

# "My memories" is a server fetch, unlike "Unlocked" - wait for its own note
# rather than the place name, which was already on screen a moment ago under
# Unlocked.
- extendedWaitUntil:
    visible: ".*you filed.*"
    timeout: 40000

# The My memories row opens the same sheet as editing: fields come back
# exactly as filed. My memories rows now carry a live distance alongside the
# place name in their accessibility label (Memories.tsx's Row), same reason
# Unlocked's row above needed the wildcard - so this tap does too.
- tapOn: ".*The step by the ferry landing.*"
- assertVisible: "Edit memory"
- assertVisible: "The step by the ferry landing"
- assertVisible: ".*ferry horn.*"

# Change the place name and save. Post becomes Save while editing - same
# button, relabelled - and tapping the bar title dismisses the keyboard, the
# same idiom the filing steps above used on "Add a memory". Both fields
# asserted above sit above the fold, so nothing here has scrolled yet.
#
# A tap on this text places the cursor where it lands, not at the end, and
# eraseText only deletes backward from there - iOS 26's edit menu has no
# Select All to fall back on (Cut/Copy/Paste/Replace/AutoFill/Look
# Up/Translate/Share, checked on-device). Tapping this exact string lands
# the cursor right before its last word every time, so erasing 60 clears
# everything before "landing" and leaves "landing" itself untouched - typed
# text is the new prefix, not the whole name, and the untouched word finishes it.
- tapOn: "The step by the ferry landing"
- eraseText: 60
- inputText: "The jetty by the ferry "
- tapOn: "Edit memory"
- tapOn: "Save"

# Back on the Memories tab - onSaved closes the editor the same way onPosted
# does, and App.tsx's mineVersion bump means My memories has already
# refetched without the tab being left and reopened. Wildcarded for the same
# distance-in-the-label reason as the tap above.
- extendedWaitUntil:
    visible: ".*The jetty by the ferry landing.*"
    timeout: 40000
- assertNotVisible: "The step by the ferry landing"

- tapOn: ".*The jetty by the ferry landing.*"
- assertVisible: "Edit memory"
- assertVisible: "The jetty by the ferry landing"
- assertVisible: ".*ferry horn.*"

# Delete this memory sits below the fold - scrollUntilVisible rather than
# assertVisible's own search, which swipes from the top and can read as the
# pageSheet's own pull-to-dismiss gesture. Cancel lives in the fixed bar, not
# the ScrollView, so it stays reachable at whatever scroll position this ends on.
- scrollUntilVisible:
    element: "Delete this memory"
    direction: DOWN
- tapOn: "Cancel"
- assertVisible: "My memories"
