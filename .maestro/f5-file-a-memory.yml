# F5 File a memory of your own (+ F21 Be somebody). docs/08-ux-flows.md
#
# The only screen in the app that writes. It files where you are standing and
# nowhere else - there is no map picker, deliberately - and what comes back is
# already unlocked, because you were the one standing there.

appId: ${APP_ID}
---
- setLocation:
    latitude: 40.7484
    longitude: -73.9857

- launchApp:
    clearState: true
    permissions:
      location: inuse

- extendedWaitUntil:
    visible: "\\d+ memories here"
    timeout: 40000

- tapOn: "Add a memory here"
- assertVisible: "Add a memory"

# One coordinate, taken from where the phone is. No field asks for it.
- tapOn: "The bench by the harbour"
- inputText: "The steps on the north side"

- tapOn: "We sat here until it got light and nobody wanted to say so."
- inputText: "Somebody had left a whole birthday cake on the step, uncut, with the candles still in it. Nobody touched it for an hour."
# hideKeyboard has no standard dismiss action on this sheet; tapping the
# bar title, which is static text, does it.
- tapOn: "Add a memory"

# A closed vocabulary, mirrored from pipeline/tags.py.
- tapOn: "food"

- tapOn: "Post"

# It comes back already open - and F21: signed Anonymous until you give a name.
- extendedWaitUntil:
    visible: ".*birthday cake.*"
    timeout: 40000
- assertVisible: "The steps on the north side"
- assertVisible: ".*Anonymous.*"
