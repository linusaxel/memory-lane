# F36: the first run's one choice. One memory opens from anywhere, with no walk
# and without standing there, and then the choice is gone. docs/08-ux-flows.md
# F36, docs/10-decisions.md "Pick one to start, then where you stand".

appId: ${APP_ID}
---
- runFlow:
    file: steps/launch.yml
    env:
      LAT: ${START_LAT}
      LNG: ${START_LNG}
      LOCATION: inuse

- extendedWaitUntil:
    visible: "Choose one to open from here"
    timeout: 20000
- tapOn: "Ringkaféen, dev seed\\. Locked, too far to open\\."
- extendedWaitUntil:
    visible: "Open this one from here, your first"
    timeout: 10000
- tapOn: "Open this one from here, your first"
- extendedWaitUntil:
    visible: ".*Lygteå.*"
    timeout: 30000
- tapOn: "Close"
- extendedWaitUntil:
    visible: "1,000 steps until the next one opens\\. You have 0\\."
    timeout: 10000
- assertNotVisible: "Choose one to open from here"
