# F25 Walk today's route. docs/08-ux-flows.md
#
# The route is anchored on wherever the device is when it first asks, so this
# flow sets location to the seed's own coordinate before launch - the same
# point pipeline/seed_dev.py prints and mobile/App.tsx falls back to. At that
# exact anchor the five seeded stops (`reach`, `filed`, `stack`, `nightspot`,
# `walk`) are the only walk-to-unlock, non-time-locked, not-yet-earned
# memories within ROUTE_RADIUS_METERS, so the route is deterministic - a
# scratch run of GET /v1/routes/today against a fresh seed and
# tests/test_api_routes.py both confirm the exact composition and order.
#
# TWO THINGS TO KNOW BEFORE EDITING THIS FILE.
#  1. Maestro matches text as a FULL-STRING regex, not a substring.
#  2. A route stop's marker title gets a leading "Stop N of 5." that an
#     ordinary pin does not - see the comment on MemoryMarker's
#     `routePosition` prop.

appId: ${APP_ID}
---
- setLocation:
    latitude: 40.7484
    longitude: -73.9857

- launchApp:
    clearState: true
    permissions:
      location: inuse

- extendedWaitUntil:
    visible: "\\d+ memories here"
    timeout: 40000

# The pill needs a position as well as a device id, so wait for "Near me"
# first - exactly f7's reasoning for the same wait.
- extendedWaitUntil:
    visible: "Near me"
    timeout: 40000

- extendedWaitUntil:
    visible: "Today's route · 0 of 5 unlocked\\."
    timeout: 40000

# The nearest of the five is already inside the 150m gate at the seed's own
# anchor - the route does not need a walk to prove its first stop.
- extendedWaitUntil:
    visible: "Stop 1 of 5\\. The bench outside, dev seed\\. Locked, within reach\\."
    timeout: 40000

- tapOn: "Stop 1 of 5. The bench outside, dev seed. Locked, within reach."
- assertVisible: "You are standing close enough to open this one."
- assertVisible: "Hold to unlock"
- longPressOn: "Unlock this memory"
- extendedWaitUntil:
    visible: ".*pretzel cart.*"
    timeout: 30000
- tapOn: "Close"

# Earning a stop updates the pill in place - no relaunch, no refetch.
- assertVisible: "Today's route · 1 of 5 unlocked\\."
