# F13 Walk into range -> F7 Unlock by standing near it -> F25 walk today's
# loop 1 -> 5 -> F30 finish it -> F15 reread it later -> F31 look back at the
# walk.
# docs/08-ux-flows.md
#
# This is the product. Everything else exists to get somebody here.
#
# The start is random: e2e/run.sh picks a walkable point in central
# Copenhagen, plants the seed round it (`seed_dev --at`), and e2e/travel.py
# writes each leg's street shape (e2e/out/legs/N.yml) and each stop's name and
# summary words (STOPn, WORDSn). E2E_START=lat,lng replays a run.
#
# THREE THINGS TO KNOW BEFORE EDITING THIS FILE.
#  1. Maestro matches text as a FULL-STRING regex, not a substring. "Walk
#     there" matches only a label that is exactly that; anything else needs .*
#  2. A marker's label is `${groupLabel}. ${STATE_LABEL[reach]}.` and it comes
#     from the MKAnnotation's `title` - not from `accessibilityLabel`, which
#     iOS ignores on a Marker. Tapping a pin therefore means naming its state
#     as well as its place, and the pin turning is directly assertable.
#  3. F25: the app opens on the plan page. The walk below is the 4 km default,
#     previewed and accepted from the start position; its titles carry a
#     "Stop N of 5." prefix. `tests/test_api_routes.py` is what pins the
#     selection and ordering rules down; this file just has to agree with them.

appId: ${APP_ID}
---
- setLocation:
    latitude: ${START_LAT}
    longitude: ${START_LNG}

- launchApp:
    clearState: true
    permissions:
      # iOS takes always/inuse/never/unset here, not allow. `inuse` is also the
      # only honest value: the app is foreground-only and app.json blocks
      # ACCESS_BACKGROUND_LOCATION (UI.md rule 2).
      location: inuse

# F25: plan, preview, accept. The default length is the walk below.
- extendedWaitUntil:
    visible: "How far today?"
    timeout: 40000
- tapOn: "Show me the walk"
- extendedWaitUntil:
    visible: "5 stops · .* loop"
    timeout: 40000
- tapOn: "Accept this walk"

- extendedWaitUntil:
    visible: "Today's route · 0 of 5 unlocked\\."
    timeout: 40000

# "Turn on location" shows until there is a position, so its going is the fix.
# Waiting on it means a slow fix reads as a slow fix, not as a locked stop.
- extendedWaitUntil:
    notVisible: "Turn on location"
    timeout: 40000

# F17: why it will not open.
- extendedWaitUntil:
    visible: "Stop 2 of 5. ${STOP2}. Locked, too far to open."
    timeout: 40000
- tapOn: "Stop 2 of 5. ${STOP2}. Locked, too far to open."
- assertVisible: "Get within 20 m and you can open it."
- tapOn: "Close"

# F25 + F13 + F7, five times: walk today's route in order, 1 -> 5, whichever
# of the seed's five stops the route puts where (never the stack first).
# Each leg is that leg's street shape from OSRM, turn by turn, so the walker
# keeps to the pavement; it ends where the street passes the stop, inside the
# 20m gate. Only the stop being stood on is ever in reach. Nothing is tapped
# while walking - the pin turns and the pill changes its mind on its own.
- runFlow: ../e2e/out/legs/1.yml
- extendedWaitUntil:
    visible: "You're at stop 1: ${STOP1}\\. Open to unlock\\."
    timeout: 45000
# The pin itself turned, not just the pill.
- assertVisible: "Stop 1 of 5. ${STOP1}. Locked, within reach."

# F29: the same spot from Explore. Every memory around, the stack as one
# counted pin, and the stop you are standing on stays shut: nothing is earned
# here. Its sheet knows it is on the walk and hands you back to it.
- tapOn: "Explore"
- extendedWaitUntil:
    visible: "The corner, dev seed \\(3\\)\\. Locked, .*"
    timeout: 40000
- assertVisible: "Add a memory here"
- assertNotVisible: "You're at stop 1: .*"
- swipe:
    start: 50%, 55%
    end: 50%, 45%
- extendedWaitUntil:
    visible: "${STOP1}\\. Locked, too far to open\\."
    timeout: 30000
- tapOn: "${STOP1}\\. Locked, too far to open\\."
- assertVisible: "Stop 1 on today's walk\\."
- assertNotVisible: "Unlock this memory"
- tapOn: "Show on the walk"
- runFlow:
    file: steps/unlock-stop.yml
    env:
      N: "1"
      STOP: "${STOP1}"
      WORDS: "${WORDS1}"

- runFlow: ../e2e/out/legs/2.yml
- runFlow:
    file: steps/unlock-stop.yml
    env:
      N: "2"
      STOP: "${STOP2}"
      WORDS: "${WORDS2}"

- runFlow: ../e2e/out/legs/3.yml
- runFlow:
    file: steps/unlock-stop.yml
    env:
      N: "3"
      STOP: "${STOP3}"
      WORDS: "${WORDS3}"
# Three earned, stop 4 out of reach: the pill points on.
- extendedWaitUntil:
    visible: "Next stop: ${STOP4}\\."
    timeout: 30000

- runFlow: ../e2e/out/legs/4.yml
- runFlow:
    file: steps/unlock-stop.yml
    env:
      N: "4"
      STOP: "${STOP4}"
      WORDS: "${WORDS4}"

- runFlow: ../e2e/out/legs/5.yml
- runFlow:
    file: steps/unlock-stop.yml
    env:
      N: "5"
      STOP: "${STOP5}"
      WORDS: "${WORDS5}"

# F30: closing the last memory shows the whole loop and what it came to, once.
- extendedWaitUntil:
    visible: "Walk done\\."
    timeout: 30000
- assertVisible: "5 memories · .* loop · .* min"
- tapOn: "Done"

- extendedWaitUntil:
    visible: "Route walked · 5 of 5 unlocked\\."
    timeout: 30000

# F15: unlocking is meant to be permanent - it outlives the sheet, the tab and
# the process. (F16, the same collection with no network, is not scripted;
# e2e/README.md has the by-hand recipe.)
#
# The tab keeps a count, so its accessibility label is "Memories, 1" once
# there is one - the visible text stays "Memories" either way.
- tapOn: "Memories.*"
- assertVisible: "Unlocked"
- assertVisible: ".*The bench outside, dev seed.*"

# A collection row opens the same sheet.
- tapOn: ".*The bench outside, dev seed.*"
- assertVisible: ".*pølsevogn.*"
- tapOn: "Close"

# Still there after the process dies. No clearState this time - that is the
# whole assertion. And the day is locked: the relaunch lands on the walked
# route, not on the plan page.
- launchApp
- extendedWaitUntil:
    visible: "Route walked · 5 of 5 unlocked\\."
    timeout: 30000
- assertNotVisible: "How far today?"
- assertNotVisible: "Walk done\\."
- tapOn: "Memories.*"
- extendedWaitUntil:
    visible: ".*The bench outside, dev seed.*"
    timeout: 30000

# F31: the walk just walked is kept. Its row opens it on the map, read-only,
# and the bar over it goes back to the list.
- tapOn: "Walks"
- extendedWaitUntil:
    visible: ".*, 5 of 5 · .*"
    timeout: 30000
- tapOn: ".*, 5 of 5 · .*"
- extendedWaitUntil:
    visible: "Walk of .*, 5 of 5\\. Close\\."
    timeout: 30000
- assertNotVisible: "Unlock this memory"
- tapOn: "Walk of .*, 5 of 5\\. Close\\."
- assertVisible: "Walks"
