# F11 Find the nearest locked memory -> F12 Walk there -> F13 Walk into range
# -> F7 Unlock by standing near it -> F25 walk today's loop 1 -> 5 -> F15
# reread it later. docs/08-ux-flows.md
#
# This is the product. Everything else exists to get somebody here.
#
# Coordinates come from pipeline/seed_dev.py and tests/test_seed_dev.py fails if
# they drift. The start is ~307m south of the `reach` memory: far enough that
# nothing is unlockable, close enough that reachOf calls it `warm` (the 150m
# gate x WARM_MULTIPLIER 3) so the sheet offers a walk rather than a shrug.
#
# THREE THINGS TO KNOW BEFORE EDITING THIS FILE.
#  1. Maestro matches text as a FULL-STRING regex, not a substring. "Walk
#     there" matches only a label that is exactly that; anything else needs .*
#  2. A marker's label is `${groupLabel}. ${STATE_LABEL[reach]}.` and it comes
#     from the MKAnnotation's `title` - not from `accessibilityLabel`, which
#     iOS ignores on a Marker. Tapping a pin therefore means naming its state
#     as well as its place, and the pin turning is directly assertable.
#  3. F25's daily route is always-on - any device with a position gets one on
#     launch, anchored where it first asks. The walk below is that route's
#     five stops, in order; its titles carry a "Stop N of 5." prefix. `tests/test_api_routes.py` is what pins the
#     selection and ordering rules down; this file just has to agree with them.

appId: ${APP_ID}
---
- setLocation:
    latitude: 40.7460
    longitude: -73.9857

- launchApp:
    clearState: true
    permissions:
      # iOS takes always/inuse/never/unset here, not allow. `inuse` is also the
      # only honest value: the app is foreground-only and app.json blocks
      # ACCESS_BACKGROUND_LOCATION (UI.md rule 2).
      location: inuse

- extendedWaitUntil:
    visible: "\\d+ memories here"
    timeout: 40000

# The pill needs a position as well as pins, and the button only says "Near
# me" once there is one. Waiting on it first means a slow fix reads as a slow
# fix rather than as a missing pill.
- extendedWaitUntil:
    visible: "Near me"
    timeout: 40000

# F25: the route needs a device id and a position too. On a route day this
# pill, not F11's nearest-lock banner, is what says where to go.
- extendedWaitUntil:
    visible: "Today's route · 0 of 5 unlocked\\."
    timeout: 40000

# F17 + F12: why it will not open, and what to do about it.
- extendedWaitUntil:
    visible: "Stop 2 of 5. The bench outside, dev seed. Locked, a short walk away."
    timeout: 40000
- tapOn: "Stop 2 of 5. The bench outside, dev seed. Locked, a short walk away."
- assertVisible: "Get within 150 m and you can open it."
- assertVisible: "Walk there"
- tapOn: "Close"

# F25 + F13 + F7, five times: walk today's route in order, 1 -> 5. From this
# start the fresh seed's route is (api/read.py, the shortest loop over every
# ordering from the anchor and back; a loop and its reverse tie, and sorting
# the stops first makes it this way round for every device id):
#   1 Where I was standing        40.7479,-73.9847   the submission
#   2 The bench outside           40.74876,-73.9857  `reach`
#   3 Four hundred metres north   40.752,-73.9857    `walk`
#   4 Where the night went long   40.7502,-73.9861   `nightspot`
#   5 The corner                  40.748,-73.987     `stack`, three on one point
# Stops sit 100-350m apart, so standing at one the next is sometimes in reach
# too, and 2 -> 3 passes within reach of 4. The pill names the lowest unearned
# stop in reach, which is the one this walk has just arrived at. Nothing is
# tapped while walking - the pin turns and the pill changes its mind on its own.
- travel:
    points:
      - "40.7460,-73.9857"
      - "40.7479,-73.9847"
    speed: 10
- extendedWaitUntil:
    visible: "You're at stop 1: Where I was standing, dev seed\\. Open to unlock\\."
    timeout: 45000
# The pin itself turned, not just the pill.
- assertVisible: "Stop 1 of 5. Where I was standing, dev seed. Locked, within reach."
# F7: the hold. longPressOn holds ~3s; the ring is HOLD_MS 900 and its
# animation callback fires while the finger is still down, so the press
# completes the unlock rather than cancelling it.
- tapOn: "You're at stop 1: .*"
- assertVisible: "You are standing close enough to open this one."
- longPressOn: "Unlock this memory"
- extendedWaitUntil:
    visible: ".*filed this one myself.*"
    timeout: 30000
- assertNotVisible: "Hold to unlock"
- tapOn: "Close"

- travel:
    points:
      - "40.7479,-73.9847"
      - "40.74876,-73.9857"
    speed: 10
- extendedWaitUntil:
    visible: "You're at stop 2: The bench outside, dev seed\\. Open to unlock\\."
    timeout: 45000
- tapOn: "You're at stop 2: .*"
- longPressOn: "Unlock this memory"
- extendedWaitUntil:
    visible: ".*pretzel cart.*"
    timeout: 30000
- tapOn: "Close"

- travel:
    points:
      - "40.74876,-73.9857"
      - "40.752,-73.9857"
    speed: 10
- extendedWaitUntil:
    visible: "You're at stop 3: Four hundred metres north, dev seed\\. Open to unlock\\."
    timeout: 45000
- tapOn: "You're at stop 3: .*"
- longPressOn: "Unlock this memory"
- extendedWaitUntil:
    visible: ".*piano into the street.*"
    timeout: 30000
- tapOn: "Close"

# Three earned, stop 4 ~200m back south and out of reach: the pill points on.
- extendedWaitUntil:
    visible: "Next stop: Where the night went long, dev seed\\."
    timeout: 30000

- travel:
    points:
      - "40.752,-73.9857"
      - "40.7502,-73.9861"
    speed: 10
- extendedWaitUntil:
    visible: "You're at stop 4: Where the night went long, dev seed\\. Open to unlock\\."
    timeout: 45000
- tapOn: "You're at stop 4: .*"
- longPressOn: "Unlock this memory"
- extendedWaitUntil:
    visible: ".*jukebox on shuffle.*"
    timeout: 30000
- tapOn: "Close"

# A stack: the pill opens the sheet on the route's own memory of the three, so
# the hold earns the stop and not a neighbour of it - and "Route walked" below
# only reads 5 of 5 if it did.
- travel:
    points:
      - "40.7502,-73.9861"
      - "40.748,-73.987"
    speed: 10
- extendedWaitUntil:
    visible: "You're at stop 5: The corner, dev seed\\. Open to unlock\\."
    timeout: 45000
- tapOn: "You're at stop 5: .*"
- longPressOn: "Unlock this memory"
- extendedWaitUntil:
    visible: ".*taxi that reversed.*"
    timeout: 30000
- tapOn: "Close"

- extendedWaitUntil:
    visible: "Route walked · 5 of 5 unlocked\\."
    timeout: 30000

# F15: unlocking is meant to be permanent - it outlives the sheet, the tab and
# the process. (F16, the same collection with no network, is not scripted;
# e2e/README.md has the by-hand recipe.)
#
# The tab keeps a count, so its accessibility label is "Memories, 1" once
# there is one - the visible text stays "Memories" either way.
- tapOn: "Memories.*"
- assertVisible: "Unlocked"
- assertVisible: ".*The bench outside, dev seed.*"

# A collection row opens the same sheet, which here offers the way back.
- tapOn: ".*The bench outside, dev seed.*"
- assertVisible: ".*pretzel cart.*"
- assertVisible: "Show on map"
- tapOn: "Show on map"
- assertVisible: "\\d+ memories here"

# Still there after the process dies. No clearState this time - that is the
# whole assertion.
- launchApp
- tapOn: "Memories.*"
- extendedWaitUntil:
    visible: ".*The bench outside, dev seed.*"
    timeout: 30000
