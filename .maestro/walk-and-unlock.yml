# F11 Find the nearest locked memory -> F12 Walk there -> F13 Walk into range
# -> F7 Unlock by standing near it -> F25 walk today's loop 1 -> 5 -> F30
# finish it -> F15 reread it later -> F31 look back at the walk.
# docs/08-ux-flows.md
#
# This is the product. Everything else exists to get somebody here.
#
# Coordinates come from pipeline/seed_dev.py and tests/test_seed_dev.py fails if
# they drift. The start is on the 33rd St pavement south of the Empire State
# Building, on the loop itself, well outside every stop's 20m gate.
#
# THREE THINGS TO KNOW BEFORE EDITING THIS FILE.
#  1. Maestro matches text as a FULL-STRING regex, not a substring. "Walk
#     there" matches only a label that is exactly that; anything else needs .*
#  2. A marker's label is `${groupLabel}. ${STATE_LABEL[reach]}.` and it comes
#     from the MKAnnotation's `title` - not from `accessibilityLabel`, which
#     iOS ignores on a Marker. Tapping a pin therefore means naming its state
#     as well as its place, and the pin turning is directly assertable.
#  3. F25: the app opens on the plan page. The walk below is the 4 km default,
#     previewed and accepted from the start position; its titles carry a
#     "Stop N of 5." prefix. `tests/test_api_routes.py` is what pins the
#     selection and ordering rules down; this file just has to agree with them.

appId: ${APP_ID}
---
- setLocation:
    latitude: 40.748054
    longitude: -73.985885

- launchApp:
    clearState: true
    permissions:
      # iOS takes always/inuse/never/unset here, not allow. `inuse` is also the
      # only honest value: the app is foreground-only and app.json blocks
      # ACCESS_BACKGROUND_LOCATION (UI.md rule 2).
      location: inuse

# F25: plan, preview, accept. The default length is the walk below.
- extendedWaitUntil:
    visible: "How far today?"
    timeout: 40000
- tapOn: "Show me the walk"
- extendedWaitUntil:
    visible: "5 stops · .* loop"
    timeout: 40000
- tapOn: "Accept this walk"

- extendedWaitUntil:
    visible: "Today's route · 0 of 5 unlocked\\."
    timeout: 40000

# "Turn on location" shows until there is a position, so its going is the fix.
# Waiting on it means a slow fix reads as a slow fix, not as a locked stop.
- extendedWaitUntil:
    notVisible: "Turn on location"
    timeout: 40000

# F17 + F12: why it will not open, and what to do about it.
- extendedWaitUntil:
    visible: "Stop 2 of 5. The bench outside, dev seed. Locked, too far to open."
    timeout: 40000
- tapOn: "Stop 2 of 5. The bench outside, dev seed. Locked, too far to open."
- assertVisible: "Get within 20 m and you can open it."
- assertVisible: "Walk there"
- tapOn: "Close"

# F25 + F13 + F7, five times: walk today's route in order, 1 -> 5. From this
# start the fresh seed's route is one clean loop round the blocks (api/read.py
# on OSRM walking metres; pipeline/seed_dev.py lays the stops out for it):
#   1 Where I was standing   5th Ave below 34th   `filed`, the submission
#   2 The bench outside      5th Ave above 34th   `reach`
#   3 Along 35th Street      35th, mid-block      `walk`
#   4 Where the night went   6th Ave at 35th      `nightspot`
#   5 The corner             Broadway at 34th     `stack`, three on one point
# Each travel is that leg's street shape from OSRM, turn by turn, so the walker
# keeps to the pavement; it ends where the street passes the stop, inside the
# 20m gate; `e2e/travel.py` prints them afresh when the walk changes. Only the
# stop being stood on is ever in reach. Nothing is tapped
# while walking - the pin turns and the pill changes its mind on its own.
- travel:
    points:
      - "40.748054,-73.985885"
      - "40.747768,-73.985219"
      - "40.748048,-73.985015"
    speed: 10
- extendedWaitUntil:
    visible: "You're at stop 1: Where I was standing, dev seed\\. Open to unlock\\."
    timeout: 45000
# The pin itself turned, not just the pill.
- assertVisible: "Stop 1 of 5. Where I was standing, dev seed. Locked, within reach."

# F29: the same spot from Explore. Every memory around, the stack as one
# counted pin, and the stop you are standing on stays shut: nothing is earned
# here. Its sheet knows it is on the walk and hands you back to it.
- tapOn: "Explore"
- extendedWaitUntil:
    visible: "The corner, dev seed \\(3\\)\\. Locked, too far to open\\."
    timeout: 40000
- assertVisible: "Add a memory here"
- assertNotVisible: "You're at stop 1: .*"
- swipe:
    start: 50%, 55%
    end: 50%, 45%
- extendedWaitUntil:
    visible: "Where I was standing, dev seed\\. Locked, too far to open\\."
    timeout: 30000
- tapOn: "Where I was standing, dev seed\\. Locked, too far to open\\."
- assertVisible: "Stop 1 on today's walk\\."
- assertNotVisible: "Unlock this memory"
- tapOn: "Show on the walk"
- extendedWaitUntil:
    visible: "You're at stop 1: Where I was standing, dev seed\\. Open to unlock\\."
    timeout: 30000
# F7: the hold. longPressOn holds ~3s; the ring is HOLD_MS 900 and its
# animation callback fires while the finger is still down, so the press
# completes the unlock rather than cancelling it.
- tapOn: "You're at stop 1: .*"
- assertVisible: "You are standing close enough to open this one."
- longPressOn: "Unlock this memory"
- extendedWaitUntil:
    visible: ".*filed this one myself.*"
    timeout: 30000
- assertNotVisible: "Hold to unlock"
- tapOn: "Close"

- travel:
    points:
      - "40.748048,-73.985015"
      - "40.748750,-73.984498"
    speed: 10
- extendedWaitUntil:
    visible: "You're at stop 2: The bench outside, dev seed\\. Open to unlock\\."
    timeout: 45000
- tapOn: "You're at stop 2: .*"
- longPressOn: "Unlock this memory"
- extendedWaitUntil:
    visible: ".*pretzel cart.*"
    timeout: 30000
- tapOn: "Close"

- travel:
    points:
      - "40.748750,-73.984498"
      - "40.749101,-73.984237"
      - "40.749719,-73.985691"
    speed: 10
- extendedWaitUntil:
    visible: "You're at stop 3: Along 35th Street, dev seed\\. Open to unlock\\."
    timeout: 45000
- tapOn: "You're at stop 3: .*"
- longPressOn: "Unlock this memory"
- extendedWaitUntil:
    visible: ".*piano into the street.*"
    timeout: 30000
- tapOn: "Close"

# Three earned, stop 4 a block and a half west and out of reach: the pill points on.
- extendedWaitUntil:
    visible: "Next stop: Where the night went long, dev seed\\."
    timeout: 30000

- travel:
    points:
      - "40.749719,-73.985691"
      - "40.750396,-73.987192"
    speed: 10
- extendedWaitUntil:
    visible: "You're at stop 4: Where the night went long, dev seed\\. Open to unlock\\."
    timeout: 45000
- tapOn: "You're at stop 4: .*"
- longPressOn: "Unlock this memory"
- extendedWaitUntil:
    visible: ".*jukebox on shuffle.*"
    timeout: 30000
- tapOn: "Close"

# A stack: the pill opens the sheet on the route's own memory of the three, so
# the hold earns the stop and not a neighbour of it - and "Route walked" below
# only reads 5 of 5 if it did.
- travel:
    points:
      - "40.750396,-73.987192"
      - "40.749383,-73.987874"
      - "40.748920,-73.987944"
      - "40.748751,-73.987510"
    speed: 10
- extendedWaitUntil:
    visible: "You're at stop 5: The corner, dev seed\\. Open to unlock\\."
    timeout: 45000
- tapOn: "You're at stop 5: .*"
- longPressOn: "Unlock this memory"
- extendedWaitUntil:
    visible: ".*taxi that reversed.*"
    timeout: 30000
# F30: not over the last memory, which is read first. Closing it shows the
# whole loop and what it came to, once.
- assertNotVisible: "Walk done\\."
- tapOn: "Close"
- extendedWaitUntil:
    visible: "Walk done\\."
    timeout: 30000
- assertVisible: "5 memories · .* loop · .* min"
- tapOn: "Done"

- extendedWaitUntil:
    visible: "Route walked · 5 of 5 unlocked\\."
    timeout: 30000

# F15: unlocking is meant to be permanent - it outlives the sheet, the tab and
# the process. (F16, the same collection with no network, is not scripted;
# e2e/README.md has the by-hand recipe.)
#
# The tab keeps a count, so its accessibility label is "Memories, 1" once
# there is one - the visible text stays "Memories" either way.
- tapOn: "Memories.*"
- assertVisible: "Unlocked"
- assertVisible: ".*The bench outside, dev seed.*"

# A collection row opens the same sheet.
- tapOn: ".*The bench outside, dev seed.*"
- assertVisible: ".*pretzel cart.*"
- tapOn: "Close"

# Still there after the process dies. No clearState this time - that is the
# whole assertion. And the day is locked: the relaunch lands on the walked
# route, not on the plan page.
- launchApp
- extendedWaitUntil:
    visible: "Route walked · 5 of 5 unlocked\\."
    timeout: 30000
- assertNotVisible: "How far today?"
- assertNotVisible: "Walk done\\."
- tapOn: "Memories.*"
- extendedWaitUntil:
    visible: ".*The bench outside, dev seed.*"
    timeout: 30000

# F31: the walk just walked is kept. Its row opens it on the map, read-only,
# and the bar over it goes back to the list.
- tapOn: "Walks"
- extendedWaitUntil:
    visible: ".*, 5 of 5 · .*"
    timeout: 30000
- tapOn: ".*, 5 of 5 · .*"
- extendedWaitUntil:
    visible: "Walk of .*, 5 of 5\\. Close\\."
    timeout: 30000
- assertNotVisible: "Unlock this memory"
- tapOn: "Walk of .*, 5 of 5\\. Close\\."
- assertVisible: "Walks"
