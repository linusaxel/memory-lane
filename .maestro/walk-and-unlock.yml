# F13 Walk into range -> F7 Unlock by standing near it -> F25 walk today's
# loop 1 -> 4 -> F30 finish it (F27 streak) -> F15/F31 reread it in the
# journal (F26 heart it, F33 leave a note), with F28 the nearby notification on
# leg 1 and F35 the paywall once walked out.
# docs/08-ux-flows.md
#
# This is the product. Everything else exists to get somebody here.
#
# The start is random: e2e/run.sh picks a walkable point in central
# Copenhagen, plants the seed round it (`seed_dev --at`), and e2e/travel.py
# writes each leg as two fixes (e2e/out/legs/N.yml) and each stop's name and
# summary words (STOPn, WORDSn). E2E_START=lat,lng replays a run.
#
# THREE THINGS TO KNOW BEFORE EDITING THIS FILE.
#  1. Maestro matches text as a FULL-STRING regex, not a substring. "Walk
#     there" matches only a label that is exactly that; anything else needs .*
#  2. A marker's label is `${groupLabel}. ${STATE_LABEL[reach]}.` and it comes
#     from the MKAnnotation's `title` - not from `accessibilityLabel`, which
#     iOS ignores on a Marker. Tapping a pin therefore means naming its state
#     as well as its place, and the pin turning is directly assertable.
#  3. F25: the app opens on the planner (F1). The walk below is the 4 km default,
#     previewed and accepted from the start position; its titles carry a
#     "Stop N of 4." prefix. `tests/test_api_routes.py` is what pins the
#     selection and ordering rules down; this file just has to agree with them.

appId: ${APP_ID}
---
# iOS takes always/inuse/never/unset here, not allow. `always` because F28's
# nearby toggle (mobile/src/geofence.ts) watches the walk in the background.
- runFlow:
    file: steps/launch.yml
    env:
      LAT: ${START_LAT}
      LNG: ${START_LNG}
      LOCATION: always

# A name mints the account, so the finish card offers F35's paywall below.
- runFlow:
    file: steps/rename.yml
    env:
      NAME: "Walker"

# F1: the planner is home and draws the walk; Start walk takes it.
- runFlow: steps/start-walk.yml

# A walk can be ended any time, from the card's ✕; with stops still to
# reach, it asks first.
- tapOn: "End walk"
- assertVisible: "End this walk\\?"
- assertVisible:
    id: "end-walk-warning"
- tapOn: "Keep walking"
- assertNotVisible: "End this walk\\?"
- assertVisible: "Next: .*\\. 1 of 4.*"
- takeScreenshot: walk-card

# "Turn on location" shows until there is a position, so its going is the fix.
# Waiting on it means a slow fix reads as a slow fix, not as a locked stop.
- extendedWaitUntil:
    notVisible: "Turn on location"
    timeout: 40000

# F17: why it will not open.
- extendedWaitUntil:
    visible: "Stop 2 of 4. ${STOP2}. Locked, too far to open."
    timeout: 40000
- tapOn: "Stop 2 of 4. ${STOP2}. Locked, too far to open."
# Only standing there opens it (docs/10, "A walk planner, nothing else").
- assertVisible: "Get within .* m to unlock it\\."
# F26: nothing to heart until it is open.
- assertNotVisible: "Heart"
- tapOn: "Close"

# F28 Notify me when a memory is nearby: with the app in the background,
# walking onto a stop of today's walk posts "A memory is nearby". The home
# screen, not a locked phone: neither Maestro nor simctl can lock the
# simulator (TODO.md, M3). Only the walk on screen is watched (App.tsx,
# startWatching(routeShown)). The regions are registered from ~2 km away, so
# walking leg 1 in crosses one and fires Enter; registered from inside, iOS
# would never say so.
- setLocation:
    latitude: ${Number(START_LAT) + 0.02}
    longitude: ${START_LNG}
- tapOn: "Journal"
- tapOn: "Settings"
- scrollUntilVisible:
    element: "Notify me when a memory is nearby"
    direction: DOWN
- tapOn: "Notify me when a memory is nearby"
# Settings opens over the journal, and the map's walk waits under both.
- tapOn: "Close settings"
- tapOn: "Close journal"
# Another app in front, not `pressKey: home`: home left this app on screen,
# and the toggle's own label then passed for the banner.
- launchApp: com.apple.Preferences
# Stand still outside every fence until locationd has checked them. It adds
# them a second or two after the toggle and first checks on the next fix; if
# that fix is already on stop 1 the fence starts Inside and never fires Enter.
# A person walks slower than Maestro. `optional` makes the wait a pause.
- extendedWaitUntil:
    visible: "never shown, a pause"
    timeout: 5000
    optional: true
- setLocation:
    latitude: ${Number(START_LAT) + 0.0201}
    longitude: ${START_LNG}
- extendedWaitUntil:
    visible: "never shown, a pause"
    timeout: 3000
    optional: true
# F25 + F13 + F7, four times: walk today's route in order, 1 -> 4, whichever
# four of the seed's five stops the route picks (never the stack first).
# Each leg is two fixes, halfway along its street shape from OSRM and where the
# street passes the stop, so the walk is quick; it ends inside the
# 20m gate. Only the stop being stood on is ever in reach. Nothing is tapped
# while walking - the pin turns and the ring comes up on its own.
- runFlow: ../e2e/out/legs/1.yml
# The banner is SpringBoard's, and Maestro reads no text in it. So tap where it
# sits: with a banner that brings this app back, without one the tap lands on
# the Settings title and nothing opens.
- extendedWaitUntil:
    visible: "never shown, a pause"
    timeout: 3000
    optional: true
- takeScreenshot: notify-nearby-banner
- tapOn:
    point: 50%, 10%
# The tap opens the memory it named (whichever fence leg 1 crossed first,
# not always stop 1), and closes the settings sheet left open:
# iOS shows one sheet at a time, and once a sheet it never showed left the
# map deaf to the hold.
- extendedWaitUntil:
    visible: "(You're right here|Get within).*"
    timeout: 20000
- assertNotVisible:
    id: "notify-nearby"
- tapOn: "Close"
- extendedWaitUntil:
    visible: "Unlock this memory"
    timeout: 45000
# The pin itself turned, not just the ring.
- assertVisible: "Stop 1 of 4. ${STOP1}. Locked, within reach."

- runFlow:
    file: steps/unlock-stop.yml
    env:
      N: "1"
      STOP: "${STOP1}"
      WORDS: "${WORDS1}"
      SLIDE: "1"

- runFlow: ../e2e/out/legs/2.yml
- runFlow:
    file: steps/unlock-stop.yml
    env:
      N: "2"
      STOP: "${STOP2}"
      WORDS: "${WORDS2}"
      SLIDE: "0"

- runFlow: ../e2e/out/legs/3.yml
- runFlow:
    file: steps/unlock-stop.yml
    env:
      N: "3"
      STOP: "${STOP3}"
      WORDS: "${WORDS3}"
      SLIDE: "0"
# Three earned, stop 4 still to reach: the card points on.
- extendedWaitUntil:
    visible: "Next: ${STOP4}.*"
    timeout: 30000

- runFlow: ../e2e/out/legs/4.yml
- runFlow:
    file: steps/unlock-stop.yml
    env:
      N: "4"
      STOP: "${STOP4}"
      WORDS: "${WORDS4}"
      SLIDE: "0"

# F30: the finish shows the whole loop and what it came to, once.
- extendedWaitUntil:
    visible:
      id: "walk-done"
    timeout: 30000
- assertVisible: "4 memories · .* loop · .* min"
# Every stop opened for nothing, and finishing earned XP.
- assertVisible: "\\+[0-9]+ XP"
# F27 + G5: e2e/sql gave this device a walk on each of the six days before,
# so today makes seven, a milestone with its own moment.
- assertVisible:
    id: "streak-milestone"
- assertVisible: "7 days in a row"
- takeScreenshot: finish-card
# F35: signed in, not subscribed: a quiet way to the paywall, never a pop-up.
- assertVisible:
    id: "walk-done-more"
# A walked walk ends itself: Done is the map again, no walk card.
- tapOn: "Done"

- extendedWaitUntil:
    visible: "Plan a walk"
    timeout: 30000
- assertNotVisible: "End walk"

# F15 + F31: the journal keeps the walk. Its row opens in place to its
# stops, and an earned one opens the same sheet. (F16, the same journal with
# no network, is not scripted; e2e/README.md has the by-hand recipe.)
- tapOn: "Journal"
- extendedWaitUntil:
    visible: ".*, 4 memories · .*"
    timeout: 30000
- tapOn: ".*, 4 memories · .*"
# A stop row's label is "Stop N, <place>, <distance>"; the walk row's names no stop.
- extendedWaitUntil:
    visible: "Stop \\d+, ${STOP1}, .*"
    timeout: 30000
- tapOn: "Stop \\d+, ${STOP1}, .*"
- assertVisible: ".*${WORDS1}.*"
# A linked name previews in the card, not a browser (docs/10, "Wikipedia
# previews inline"). e2e/sql makes WORDS1 the link.
- tapOn: "${WORDS1}"
- extendedWaitUntil:
    visible:
      id: "wiki-preview"
    timeout: 15000
- assertVisible: "Read on Wikipedia.*"
# Centred, as the note below is: low down, the pinned heart covers it.
- scrollUntilVisible:
    element: "Close preview"
    direction: UP
    centerElement: true
- tapOn: "Close preview"
- assertNotVisible:
    id: "wiki-preview"
# F26: the heart fills and the count goes up, and both outlive the sheet.
- tapOn: "Heart"
- extendedWaitUntil:
    visible:
      text: "Heart"
      selected: true
    timeout: 30000
# F33: one note each, and posting again rewrites it rather than adding one.
# Return sends, because on a long memory the send link is under the keyboard.
# Centred, because Maestro calls the field visible while the pinned heart and
# button still cover it, and the tap would land on them.
- scrollUntilVisible:
    element:
      id: "note"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "note"
- inputText: "Stood here at dawn."
- pressKey: Enter
# Rewrite is only offered on a note the server has, not on a draft.
- extendedWaitUntil:
    visible: "Rewrite"
    timeout: 30000
# Rewrite focuses the field with the cursor after the old note.
- tapOn: "Rewrite"
- eraseText: 40
- inputText: "Stood here twice."
- pressKey: Enter
- extendedWaitUntil:
    visible: "Rewrite"
    timeout: 30000
- assertVisible: "Stood here twice\\."
- assertNotVisible: "Stood here at dawn\\."
- tapOn: "Close"

# Still there after the process dies. No clearState this time - that is the
# whole assertion. The walk is ended, so the relaunch lands on the map.
- launchApp
- extendedWaitUntil:
    visible: "Plan a walk"
    timeout: 30000
- assertNotVisible:
    id: "walk-done"
- tapOn: "Journal"
- extendedWaitUntil:
    visible: ".*, 4 memories · .*"
    timeout: 30000
- tapOn: ".*, 4 memories · .*"
# F26 + F33: the heart and the note outlive the sheet and the process. The
# note is the server's now, under the summary and whatever is attached.
- tapOn: "Stop \\d+, ${STOP1}, .*"
- assertVisible:
    text: "Heart"
    selected: true
- scrollUntilVisible:
    element: "Stood here twice\\."
    direction: DOWN
- tapOn: "Close"
- tapOn: "Close journal"

# The planner is walked out: a second walk the same day is a subscriber's
# (docs/10, "A walk planner, nothing else").
- tapOn: "Plan a walk"
- extendedWaitUntil:
    visible: "This week's free walk is done"
    timeout: 30000
- assertNotVisible: "End walk"
- assertVisible:
    id: "more-walks"

# The walk is kept: the journal's Walks tab, as cards, draws it as its shape,
# and a card shows the walk on the map again.
- tapOn: "Journal"
- tapOn:
    id: "walks-view"
- takeScreenshot: walk-cards
- tapOn:
    id: "walk-card"
    index: 0
- assertVisible:
    id: "past-walk"
- tapOn: "Done"

# F35: the paywall has nothing to sell on a simulator (no RevenueCat key) and
# says so, with a way out. Renamed Paid, e2e/sql's `subscriber` pays, and the
# planner plans again.
- tapOn:
    id: "more-walks"
- extendedWaitUntil:
    visible: "Walk every day"
    timeout: 20000
- assertVisible:
    id: "subscriptions-unavailable"
- tapOn: "Not now"
- runFlow:
    file: steps/rename.yml
    env:
      NAME: "Paid"
- extendedWaitUntil:
    visible: "[0-9]+ memor(y|ies) · .*"
    timeout: 40000
- assertNotVisible: "This week's free walk is done"
- tapOn: "Next"
- assertVisible:
    id: "walk-stops"
