# F1 plan a walk -> F32 Show me another, round the Copenhagen lakes -> F31
# look back at the walks already walked there. docs/08-ux-flows.md
#
# e2e/run.sh plants `seed_dev --routes lakes` for this flow instead of the
# random-start cluster: stops every ~400 m round the three lakes, each named
# by its lake. The start is OLUFSVEJ in pipeline/seed_dev.py. It also gives
# the device two past walks (run.sh `past_walks`): the south end, 5 of 5, and
# one given up at 2 of 5.
#
# The whole slider, 10 km. The lakes top out near 7 km however many stops, so
# every walk here is the longest from here. Which of them the first preview
# shows is a random roll; only some reach Sankt Jørgens Sø, the far lake, so
# Show me another is tapped until one does. A re-roll that came back
# unchanged would have taken the button away, so reaching it is F32 working.

appId: ${APP_ID}
---
- setLocation:
    latitude: 55.7007
    longitude: 12.5759

- launchApp:
    clearState: true
    permissions:
      location: inuse

- runFlow: steps/sign-in.yml

# F29: the map of what is locked comes first; Plan a walk opens F1.
- extendedWaitUntil:
    visible: "Plan a walk"
    timeout: 40000
- tapOn: "Plan a walk"
- extendedWaitUntil:
    visible: "How far today?"
    timeout: 20000

# One way, ending where the map is tapped: anywhere near the start is within
# 4 km. The preview's line has no " loop" on it; Loop again for the rest.
- tapOn: "One way"
- tapOn: "Pick where it ends"
- assertVisible: "Where does it end?"
- tapOn:
    point: "50%,30%"
- assertVisible: "Ends where you tapped"
- tapOn: "Show me the walk"
- extendedWaitUntil:
    visible: "[0-9]+ stops? · [0-9.]+ k?m"
    timeout: 40000
- tapOn: "Change length"
- tapOn: "Loop"
- assertNotVisible: "Ends where you tapped"

# The slider seeks where it is tapped (tapToSeek), so its right end is 10 km,
# wherever the page puts it. The value is the "10 km" above the slider; the end
# label under it says the same.
- tapOn:
    text: "Walk length"
    point: "99%,50%"
- assertVisible:
    text: "10 km"
    above: "Walk length"
- tapOn: "Show me the walk"
- extendedWaitUntil:
    visible: "10 stops · .* loop"
    timeout: 40000
- assertVisible: "The longest from here\\."
# Past Sortedams Sø, the lake at the door, on every roll.
- assertVisible: "Stop .* of 10\\. Peblinge Sø.*"

- repeat:
    while:
      notVisible: "Stop .* of 10\\. Sankt Jørgens Sø.*"
    times: 7
    commands:
      - tapOn: "Show me another"
      - waitForAnimationToEnd
- assertVisible: "Stop .* of 10\\. Sankt Jørgens Sø.*"
- assertVisible: "10 stops · .* loop"
- assertVisible: "Show me another"

# Accepting is what registers the device, and with it the past walks.
- tapOn: "Accept this walk"
- extendedWaitUntil:
    visible: "On a walk · .* of 10 unlocked\\."
    timeout: 40000

# F31: the Walks tab opens on the history, and a row opens in place to the
# memories it earned; the stops it never reached stay out.
- tapOn: "Journal"
- extendedWaitUntil:
    visible: ".*, 5 memories · .*"
    timeout: 30000
- assertVisible: ".*, 2 memories · .*"
- tapOn: ".*, 2 memories · .*"
- extendedWaitUntil:
    visible: "Peblinge Sø 5, dev seed, .*"
    timeout: 30000
- assertVisible: "Sortedams Sø 4, dev seed, .*"
- assertNotVisible: "Sortedams Sø 3, dev seed, .*"
- tapOn: ".*, 2 memories · .*"
- tapOn: ".*, 5 memories · .*"
- scrollUntilVisible:
    element: "Sankt Jørgens Sø 7, dev seed, .*"
    direction: DOWN
    centerElement: true
- tapOn: "Sankt Jørgens Sø 7, dev seed, .*"
- assertVisible: "Heart this memory"
- tapOn: "Close"
- tapOn: "Close journal"
- assertVisible: "On a walk · .* of 10 unlocked\\."
