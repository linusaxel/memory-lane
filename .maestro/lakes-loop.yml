# The planner, round the Copenhagen lakes: F8 be asked for location (and
# refused), F1 the planner (loop, one way, nothing walkable),
# F32 another walk, then the whole slider and F31 past walks.
# docs/08-ux-flows.md
#
# No walk is accepted until the end, so the first launches share one database
# and the past walks (e2e/sql/lakes-loop.sql) land only on Accept.
#
# e2e/run.sh plants `seed_dev --routes lakes` for this flow instead of the
# random-start cluster: stops every ~400 m round the three lakes, each named
# by its lake. The start is OLUFSVEJ in pipeline/seed_dev.py. It also gives
# the device two past walks (run.sh `past_walks`): the south end, 5 of 5, and
# one given up at 2 of 5.
#
# The whole slider, 10 km. The lakes top out near 7 km however many stops, so
# every walk here is the longest from here. Which of them the first preview
# shows is a random roll; only some reach Sankt Jørgens Sø, the far lake, so
# Next walk is tapped until one does, stepping the length when the lakes
# run out of walks at it, so reaching it is F32 working.

appId: ${APP_ID}
---
# ---- F8 + F1
#
# The first screen is ours, not a system dialog: the map, and from its Plan a
# walk the planner, drawing a walk from central Copenhagen, and its Use my location is the ask, a press with a
# reason (F8).
- runFlow:
    file: steps/launch.yml
    env:
      LAT: 55.7007
      LNG: 12.5759
      LOCATION: unset
- extendedWaitUntil:
    visible:
      id: "planning-from-centre"
    timeout: 40000
- tapOn: "Use my location"
- tapOn:
    text: "Allow While Using App"
    optional: true

# F1: drawn again from here, a loop. The stops land as the line draws
# through them.
- extendedWaitUntil:
    visible: "Stop [0-9]+ of [0-9]+\\. .*"
    timeout: 40000
- assertNotVisible:
    id: "planning-from-centre"
- assertVisible: "Loop"
# Customize is a subscriber's: for a free walker the Plus row is
# the paywall.
- tapOn:
    id: "themes"
- extendedWaitUntil:
    visible: "Walk every day"
    timeout: 20000
- tapOn: "Not now"
- assertNotVisible:
    id: "walk-choices"

# F32: › is another walk as good, or one of a similar length, still a preview.
- assertNotVisible: "Previous walk"
- tapOn: "Next walk"
- extendedWaitUntil:
    visible: "Previous walk"
    timeout: 40000
- assertVisible: "Stop [0-9]+ of [0-9]+\\. .*"
# Pages: back to the first, which has no ‹.
- tapOn: "Previous walk"
- extendedWaitUntil:
    notVisible: "Previous walk"
    timeout: 5000

# × goes back to the map, and Plan a walk plans again.
- tapOn: "Close the planner"
- assertNotVisible: "Start this walk"
- tapOn: "Plan a walk"
- extendedWaitUntil:
    visible: "Stop [0-9]+ of [0-9]+\\. .*"
    timeout: 40000

# ---- F8, refused
#
# A reviewer who taps Deny still gets a walk, planned from central Copenhagen and saying so.
- runFlow:
    file: steps/launch.yml
    env:
      LAT: 55.7007
      LNG: 12.5759
      LOCATION: never
- extendedWaitUntil:
    visible:
      id: "planning-from-centre"
    timeout: 40000

# ---- F1, nothing walkable
#
# From Malmö there is nothing within any length of walk. The planner says so
# and offers the slider back, rather than accepting an empty day. Not
# Copenhagen: `seed_dev --routes lakes` plants the lakes there.
- runFlow:
    file: steps/launch.yml
    env:
      LAT: 55.605
      LNG: 13.0038
      LOCATION: inuse
- extendedWaitUntil:
    visible:
      id: "no-walk"
    timeout: 40000
- assertVisible: "Walk length"

# ---- F1 the whole slider, F32 until the far lake, F31 past walks
- runFlow:
    file: steps/launch.yml
    env:
      LAT: 55.7007
      LNG: 12.5759
      LOCATION: inuse

# F1: the planner draws a walk at once.
- extendedWaitUntil:
    visible: "Stop [0-9]+ of [0-9]+\\. .*"
    timeout: 40000

# One way, ending where the map is tapped: anywhere near the start is within
# 4 km. The chip flips the shape; tapped again it is a loop.
- tapOn: "Loop"
- assertVisible: "Where does it end?"
- tapOn:
    point: "50%,30%"
- assertVisible: "Change the end"
- assertNotVisible: "Walk length"
- extendedWaitUntil:
    visible: "Stop [0-9]+ of [0-9]+\\. .*"
    timeout: 40000
- tapOn: "One way"
- assertNotVisible: "Change the end"

# The slider seeks where it is tapped (tapToSeek), so its right end is 10 km,
# wherever the page puts it. The value is the "10 km" beside it.
- tapOn:
    text: "Walk length"
    point: "99%,50%"
- assertVisible:
    text: "10 km"
    rightOf: "Walk length"
- extendedWaitUntil:
    visible: "Stop 10 of 10\\. .*"
    timeout: 40000
# Past Sortedams Sø, the lake at the door, on every roll. The stops land as
# the line draws through them.
- extendedWaitUntil:
    visible: "Stop .* of 10\\. Peblinge Sø.*"
    timeout: 5000

- repeat:
    while:
      notVisible: "Stop .* of [0-9]+\\. Sankt Jørgens Sø.*"
    times: 7
    commands:
      - tapOn: "Next walk"
      - waitForAnimationToEnd
- assertVisible: "Stop .* of [0-9]+\\. Sankt Jørgens Sø.*"
- assertVisible: "Next walk"

# Accepting is what registers the device, and with it the past walks.
- tapOn: "Start this walk"
- extendedWaitUntil:
    visible: "Next: .*\\. .* of 10.*"
    timeout: 40000

# F31: the Walks tab opens on the history, and a row opens in place to the
# memories it earned; the stops it never reached stay out.
- tapOn: "Journal"
- extendedWaitUntil:
    visible: ".*, 5 memories · .*"
    timeout: 30000
- assertVisible: ".*, 2 memories · 4\\.0 km"
- tapOn: ".*, 2 memories · 4\\.0 km"
- extendedWaitUntil:
    visible: "Stop \\d+, Peblinge Sø 5, dev seed, .*"
    timeout: 30000
- assertVisible: "Stop \\d+, Sortedams Sø 4, dev seed, .*"
- assertNotVisible: "Stop \\d+, Sortedams Sø 3, dev seed, .*"
- tapOn: ".*, 2 memories · 4\\.0 km"
# The sections are pages: a swipe turns one, and the tab follows it.
- swipe:
    direction: LEFT
- extendedWaitUntil:
    visible:
      text: "Unlocked"
      selected: true
    timeout: 10000
- swipe:
    direction: RIGHT
- extendedWaitUntil:
    visible:
      text: "Walks"
      selected: true
    timeout: 10000
- tapOn: "Close journal"
- assertVisible: "Next: .*\\. .* of 10.*"
