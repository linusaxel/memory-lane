# F35 keys and the subscription, when a free account has nothing left to open
# a memory with. docs/08-ux-flows.md, docs/10-decisions.md "Keys open a lock,
# and today's walk is free".
#
# e2e/run.sh's `broke` trigger has the account the app mints use up its
# welcome unlock, and it has no keys; typing a name mints it. Standing on a pin
# off any walk, a faded lock stands in for a ring that would be refused. Under
# it, "Out of keys", and Get keys opens the paywall. It has nothing to sell on
# a simulator (no RevenueCat key) and says so, with a way out. Renamed Paid,
# `subscriber` pays for it, and the ring is there to hold.

appId: ${APP_ID}
---
- runFlow:
    file: steps/launch.yml
    env:
      LAT: ${BENCH_LAT}
      LNG: ${BENCH_LNG}
      LOCATION: inuse

# Reading the profile creates nothing; a name mints the account, spent.
- runFlow:
    file: steps/rename.yml
    env:
      NAME: "Broke"

- extendedWaitUntil:
    visible: "Out of keys"
    timeout: 40000
- assertVisible: "Ringkaféen, dev seed\\..*"
- assertNotVisible: "Unlock this memory"
- tapOn: "Get keys"
- extendedWaitUntil:
    visible: "Open any memory you stand on"
    timeout: 20000
- assertVisible:
    id: "keys-unavailable"
- assertVisible:
    id: "subscriptions-unavailable"
- tapOn: "Not now"

- runFlow:
    file: steps/rename.yml
    env:
      NAME: "Paid"
- extendedWaitUntil:
    visible: "Unlock this memory"
    timeout: 40000
- assertVisible: "Ringkaféen, dev seed\\..*"
- longPressOn: "Unlock this memory"
- extendedWaitUntil:
    visible: ".*Lygteå.*"
    timeout: 30000
