# F29 the map and its peek + M6 walk here + F1 plan a walk (loop, one way, a theme) + F32 show me another + F8 be asked for location, F1 nothing walkable.
# docs/08-ux-flows.md
#
# Everything here only looks: nothing is accepted, so no route row is written
# and the three launches can share one database.

appId: ${APP_ID}
---
# ---- F1 + F8
#
# The first screen is ours, not a system dialog: the map, then one question
# and one slider.
# Location is asked by the button, a press with a reason.
- runFlow:
    file: steps/launch.yml
    env:
      LAT: ${START_LAT}
      LNG: ${START_LNG}
      LOCATION: unset

# F29: the map of what is locked comes first. A pin opens the peek, bars and
# no summary, and Walk here opens F1 for a walk through that pin (TODO.md M6).
- extendedWaitUntil:
    visible: ".*\\. Locked, too far to open\\."
    timeout: 20000
- tapOn: ".*\\. Locked, too far to open\\."
- extendedWaitUntil:
    visible: "Walk here"
    timeout: 10000
- tapOn: "Walk here"
- tapOn:
    text: "Allow While Using App"
    optional: true
# Drawn at once, and every walk names the pin it passes.
- extendedWaitUntil:
    visible: "A walk through .*"
    timeout: 40000
- extendedWaitUntil:
    visible: "[0-9]+ stops? · .* loop"
    timeout: 40000
- tapOn: "Back to the map"
- tapOn: "Plan a walk"

# The preview: the whole loop on the map, and a decision.
- extendedWaitUntil:
    visible: "4 stops · .* loop"
    timeout: 40000
- assertVisible: "Start this walk"
- assertNotVisible: "Planning from central Copenhagen.*"
# A preview is a look: its pins carry their stop numbers already.
- assertVisible: "Stop 1 of 4\\. .*"

# F32: › is another walk as good, or one of a similar length, still a preview.
- assertNotVisible: "Previous walk"
- tapOn: "Next walk"
- extendedWaitUntil:
    visible: "Previous walk"
    timeout: 40000
- assertVisible: "[0-9]+ stops · .* loop"
- assertVisible: "Start this walk"
# Pages: back to the first, which has no ‹, and on again.
- tapOn: "Previous walk"
- extendedWaitUntil:
    notVisible: "Previous walk"
    timeout: 5000
- assertVisible: "4 stops · .* loop"
- tapOn: "Next walk"
- extendedWaitUntil:
    visible: "Previous walk"
    timeout: 5000

# One way redraws in place: the same four stops' worth, ending somewhere new.
- tapOn: "One way"
- extendedWaitUntil:
    visible: "[0-9]+ stops · [0-9.]+ k?m"
    timeout: 40000
- assertNotVisible: "[0-9]+ stops · .* loop"
- tapOn: "Loop"

# ---- F8, refused
#
# A reviewer who taps Deny still gets a walk, planned from central Copenhagen and saying so.
- runFlow:
    file: steps/launch.yml
    env:
      LAT: ${START_LAT}
      LNG: ${START_LNG}
      LOCATION: never
- tapOn: "Plan a walk"
- extendedWaitUntil:
    visible: "Planning from central Copenhagen\\. Turn on location to plan from where you are\\."
    timeout: 40000

# ---- F1, nothing walkable
#
# From Malmö there is nothing within any length of walk. The preview says so
# and offers the slider back, rather than accepting an empty day. Not
# Copenhagen: `seed_dev --routes lakes` plants the lakes there.
- runFlow:
    file: steps/launch.yml
    env:
      LAT: 55.605
      LNG: 13.0038
      LOCATION: inuse
- tapOn: "Plan a walk"
- extendedWaitUntil:
    visible: "No walk within 10 km from here\\."
    timeout: 40000
- assertVisible: "Walk length"
