# F1 plan a walk + F8 be asked for location, F19 somewhere with no walk.
# docs/08-ux-flows.md
#
# Everything here only looks: nothing is accepted, so no route row is written
# and the three launches can share one database.
#
# F23 (sealed until a date) used to be scripted here, by standing on the sealed
# pin. A sealed memory is never a route stop and the map draws nothing else,
# so there is no pin to stand on; tests/test_api_routes.py and
# mobile/src/reach.test.ts hold the rule instead.

appId: ${APP_ID}
---
# ---- F1 + F8
#
# The first screen is ours, not a system dialog: one question and one slider.
# Location is asked by the button, a press with a reason.
- setLocation:
    latitude: 40.7484
    longitude: -73.9857

- launchApp:
    clearState: true
    permissions:
      location: unset

- extendedWaitUntil:
    visible: "How far today?"
    timeout: 40000
- assertVisible: "4 km"

- tapOn: "Show me the walk"
- tapOn:
    text: "Allow While Using App"
    optional: true

# The preview: the whole loop on the map, and a decision.
- extendedWaitUntil:
    visible: "5 stops · .* loop"
    timeout: 40000
- assertVisible: "Accept this walk"
- assertNotVisible: "Planning from Midtown.*"
# A preview is a look: its pins carry their stop numbers already.
- assertVisible: "Stop 1 of 5\\. .*"

# Changing your mind costs nothing: nothing was stored.
- tapOn: "Change length"
- assertVisible: "How far today?"

# ---- F8, refused
#
# A reviewer who taps Deny still gets a walk, planned from Midtown and saying so.
- launchApp:
    clearState: true
    permissions:
      location: never

- extendedWaitUntil:
    visible: "How far today?"
    timeout: 40000
- tapOn: "Show me the walk"
- extendedWaitUntil:
    visible: "Planning from Midtown\\. Turn on location to plan from where you are\\."
    timeout: 40000

# ---- F19
#
# From Copenhagen there is nothing within any length of walk. The preview says
# so and offers the slider back, rather than accepting an empty day.
- setLocation:
    latitude: 55.6759
    longitude: 12.5655

- launchApp:
    clearState: true
    permissions:
      location: inuse

- extendedWaitUntil:
    visible: "How far today?"
    timeout: 40000
- tapOn: "Show me the walk"
- extendedWaitUntil:
    visible: "No walk that long from here"
    timeout: 40000
- assertNotVisible: "Accept this walk"
- tapOn: "Change length"
- assertVisible: "How far today?"
