# F1 plan a walk (loop, one way, a theme) + F32 show me another + F8 be asked for location, F19 somewhere with no walk.
# docs/08-ux-flows.md
#
# Everything here only looks: nothing is accepted, so no route row is written
# and the three launches can share one database.
#
# F23 (sealed until a date) used to be scripted here, by standing on the sealed
# pin. A sealed memory is never a route stop and the map draws nothing else,
# so there is no pin to stand on; tests/test_api_routes.py and
# mobile/src/reach.test.ts hold the rule instead.

appId: ${APP_ID}
---
# ---- F1 + F8
#
# The first screen is ours, not a system dialog: one question and one slider.
# Location is asked by the button, a press with a reason.
- setLocation:
    latitude: 55.67886
    longitude: 12.57586

- launchApp:
    clearState: true
    permissions:
      location: unset

- extendedWaitUntil:
    visible: "How far today?"
    timeout: 40000
- assertVisible: "4 km"

- tapOn: "Show me the walk"
- tapOn:
    text: "Allow While Using App"
    optional: true

# The preview: the whole loop on the map, and a decision.
- extendedWaitUntil:
    visible: "5 stops · .* loop"
    timeout: 40000
- assertVisible: "Accept this walk"
- assertNotVisible: "Planning from central Copenhagen.*"
# A preview is a look: its pins carry their stop numbers already.
- assertVisible: "Stop 1 of 5\\. .*"

# F32: another walk as good, still a preview.
- tapOn: "Show me another"
- extendedWaitUntil:
    visible: "5 stops · .* loop"
    timeout: 40000
- assertVisible: "Accept this walk"

# Changing your mind costs nothing: nothing was stored.
- tapOn: "Change length"
- assertVisible: "How far today?"

# One way: the same five stops' worth of walk, ending somewhere new.
- tapOn: "One way"
- assertVisible: "Five memories, ending somewhere new\\."
- tapOn: "Show me the walk"
- extendedWaitUntil:
    visible: "5 stops · [0-9.]+ k?m"
    timeout: 40000
- assertNotVisible: "5 stops · .* loop"
- tapOn: "Change length"

# A theme the seed carries nowhere: no walk, and the slider back.
- tapOn: "sport"
- tapOn: "Show me the walk"
- extendedWaitUntil:
    visible: "No walk that long from here"
    timeout: 40000
- assertNotVisible: "Accept this walk"
- tapOn: "Change length"
- assertVisible: "How far today?"

# ---- F8, refused
#
# A reviewer who taps Deny still gets a walk, planned from central Copenhagen and saying so.
- launchApp:
    clearState: true
    permissions:
      location: never

- extendedWaitUntil:
    visible: "How far today?"
    timeout: 40000
- tapOn: "Show me the walk"
- extendedWaitUntil:
    visible: "Planning from central Copenhagen\\. Turn on location to plan from where you are\\."
    timeout: 40000

# ---- F19
#
# From Malmö there is nothing within any length of walk. The preview says so
# and offers the slider back, rather than accepting an empty day. Not
# Copenhagen: `seed_dev --routes lakes` plants the lakes there.
- setLocation:
    latitude: 55.605
    longitude: 13.0038

- launchApp:
    clearState: true
    permissions:
      location: inuse

- extendedWaitUntil:
    visible: "How far today?"
    timeout: 40000
- tapOn: "Show me the walk"
- extendedWaitUntil:
    visible: "No walk that long from here"
    timeout: 40000
- assertNotVisible: "Accept this walk"
- tapOn: "Change length"
- assertVisible: "How far today?"
