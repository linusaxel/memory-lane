# F35 subscribe, when a free account has nothing left to open a memory with.
# docs/08-ux-flows.md, docs/10-decisions.md "Three free a day, then steps where
# you stand".
#
# e2e/run.sh's `broke` trigger has the account the app mints use up today's
# free unlocks, and there are no steps on a simulator; typing a name mints it.
# Standing on a pin, a faded lock stands in for a ring that would be refused.
# It is labelled with how far off an unlock is, and a tap opens the paywall. It
# has nothing to sell on a simulator (no RevenueCat key) and says so, with a way
# out. Renamed Paid, `subscriber` pays for it, and the ring is there to hold.

appId: ${APP_ID}
---
- runFlow:
    file: steps/launch.yml
    env:
      LAT: ${BENCH_LAT}
      LNG: ${BENCH_LNG}
      LOCATION: inuse

# Reading the profile creates nothing; a name mints the account, spent.
- tapOn: "Menu"
- tapOn: "Journal"
- tapOn: "Edit profile"
- tapOn: "The name your memories are signed with"
- inputText: "Broke"
- tapOn: "Close profile"
- tapOn: "Close journal"
- launchApp:
    clearState: false

- extendedWaitUntil:
    visible: "1,000 steps to go · about 10 min walking"
    timeout: 40000
- assertVisible: "Ringkaféen, dev seed\\..*"
- assertNotVisible: "Unlock this memory"
- tapOn: "1,000 steps to go · about 10 min walking"
- extendedWaitUntil:
    visible: "Open any memory you stand on"
    timeout: 20000
- assertVisible: "Subscriptions aren't available right now\\."
- tapOn: "Not now"

- tapOn: "Menu"
- tapOn: "Journal"
- tapOn: "Edit profile"
- tapOn: "The name your memories are signed with"
- eraseText: 10
- inputText: "Paid"
- tapOn: "Close profile"
- tapOn: "Close journal"

# The profile is read at launch; a relaunch reads the subscription.
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Unlock this memory"
    timeout: 40000
- assertVisible: "Ringkaféen, dev seed\\..*"
- longPressOn: "Unlock this memory"
- extendedWaitUntil:
    visible: ".*Lygteå.*"
    timeout: 30000
