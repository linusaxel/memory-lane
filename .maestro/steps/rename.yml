# Sign as NAME on the Collector's page, then relaunch: the profile, and so the subscription, is read
# at launch. e2e/sql's `subscriber` trigger keys off the name.
appId: ${APP_ID}
---
- tapOn:
    id: collector-hud
- tapOn: "The name your memories are signed with"
- eraseText: 10
- inputText: ${NAME}
- tapOn: "Close Collector"
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "Plan a walk"
    timeout: 40000
- tapOn: "Plan a walk"
