# Stand at LAT,LNG, open a cleared install with LOCATION permission, sign in,
# and wait for the planner. notify-nearby.yml launches by hand: it needs notifications.
appId: ${APP_ID}
---
- setLocation:
    latitude: ${LAT}
    longitude: ${LNG}
- launchApp:
    clearState: true
    permissions:
      location: ${LOCATION}
- runFlow: sign-in.yml
# The planner is home, walked out or not; Journal is on it either way.
- extendedWaitUntil:
    visible: "Journal"
    timeout: 40000
