# Stand at LAT,LNG, open a cleared install with LOCATION permission, sign in,
# and open the planner. Notifications are allowed for walk-and-unlock's F28.
appId: ${APP_ID}
---
- setLocation:
    latitude: ${LAT}
    longitude: ${LNG}
- launchApp:
    clearState: true
    permissions:
      location: ${LOCATION}
      notifications: allow
- runFlow: sign-in.yml
# The map is home; Plan a walk opens the planner, walked out or not.
- extendedWaitUntil:
    visible: "Plan a walk"
    timeout: 40000
- tapOn: "Plan a walk"
