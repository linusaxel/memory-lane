# F25: the planner draws today's walk from where you stand; accept it. The
# default length is a 4-stop loop; walk-and-unlock.yml starts here.
appId: ${APP_ID}
---
- extendedWaitUntil:
    visible: "4 memories · .* loop"
    timeout: 40000
# Next is the stops, which everyone sees, then Start.
- tapOn: "Next"
- assertVisible:
    id: "walk-stops"
- tapOn: "Start this walk"
- extendedWaitUntil:
    visible: "Next: .*\\. 1 of 4.*"
    timeout: 40000
