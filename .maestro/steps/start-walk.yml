# F25: the planner draws today's walk from where you stand; accept it. The
# default length is a 4-stop loop; walk-and-unlock.yml starts here.
appId: ${APP_ID}
---
# The walk's pins are its stops; the card is the loop, its length and Start.
- extendedWaitUntil:
    visible: "Stop 4 of 4\\. .*"
    timeout: 40000
- assertVisible: "Loop"
- tapOn: "Start this walk"
- extendedWaitUntil:
    visible: "Next: .*\\. 1 of 4.*"
    timeout: 40000
