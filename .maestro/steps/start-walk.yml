# F25: the planner draws today's walk from where you stand; accept it. The
# default length is a 4-stop loop; walk-and-unlock.yml starts here.
appId: ${APP_ID}
---
# Loop or one way first, then a loop's length, then the walk and Start.
- extendedWaitUntil:
    visible: "A walk from here"
    timeout: 40000
- tapOn: "Loop"
- extendedWaitUntil:
    visible: "4 memories · .* loop"
    timeout: 40000
- tapOn: "Next"
- assertVisible:
    id: "walk-stops"
- tapOn: "Start this walk"
- extendedWaitUntil:
    visible: "Next: .*\\. 1 of 4.*"
    timeout: 40000
