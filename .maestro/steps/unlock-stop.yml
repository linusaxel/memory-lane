# Stand on stop N and open it: walk-and-unlock.yml runs this once per stop,
# after that stop's leg. Env: N, STOP (its place name), WORDS (from its summary).
appId: ${APP_ID}
---
# F7: the stop's pin turns in reach and the lock comes up alone on the map,
# with no sheet to open.
- extendedWaitUntil:
    visible: "Stop ${N} of 4. ${STOP}. Locked, within reach."
    timeout: 45000
- assertVisible: "Unlock this memory"
# The hold. longPressOn holds ~3s; the ring is HOLD_MS 900 and its
# animation callback fires while the finger is still down, so the press
# completes the unlock rather than cancelling it.
- longPressOn: "Unlock this memory"
- extendedWaitUntil:
    visible: ".*${WORDS}.*"
    timeout: 30000
- assertNotVisible: "Unlock this memory"
# F30: never over a memory, which is read first. Only closing the last one
# shows the whole loop.
- assertNotVisible: "Nice walk\\."
- tapOn: "Close"
