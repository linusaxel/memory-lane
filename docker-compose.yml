services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: memorylane
      POSTGRES_PASSWORD: memorylane
      POSTGRES_DB: memorylane
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memorylane"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8080:8000"
    environment:
      DATABASE_URL: postgresql://memorylane:memorylane@db:5432/memorylane
      MEDIA_DIR: /data/media
      # Street distances for today's route. Crow-flies when osrm is not up.
      ROUTING_URL: http://osrm:5000
    volumes:
      # Uploaded photos and recordings. A bind mount rather than a named volume:
      # it survives a rebuild just the same, and it lets the host see the files -
      # which is what `python -m pipeline.seed_dev` needs, since it writes its
      # photo and recording from outside the container.
      - ./media:/data/media
    depends_on:
      db:
        condition: service_healthy

  # Walking distances and street shapes for today's route (api/streets.py).
  # Behind a profile: it needs `./osrm/build.sh` first, and plain `up` must not
  # fail without it. `docker compose --profile routing up -d`.
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles: [routing]
    command: osrm-routed --algorithm mld /data/streets.osrm
    ports:
      - "5001:5000"
    volumes:
      - ./osrm:/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
